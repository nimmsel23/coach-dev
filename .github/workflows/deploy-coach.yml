# Coach owns its preview and production Hosting releases.
# Firestore rules remain owned by VitalOS.

name: Deploy Coach

on:
  workflow_dispatch:
    inputs:
      production:
        description: Deploy to the live Coach site
        type: boolean
        default: false
  push:
    branches: [dev]
    paths:
      - '.gitmodules'
      - 'modules/plan'
      - 'src/**'
      - 'coach.html'
      - 'coach-shell.html'
      - 'local.html'
      - 'clientforge.html'
      - 'public-coach/**'
      - 'website'
      - 'fitness/catalog/kb/**'
      - 'scripts/**'
      - 'vite.config.js'
      - 'src/vue-shell/**'
      - 'tailwind.config.cjs'
      - 'postcss.config.cjs'
      - 'package.json'
      - 'mini-app.json'
      - 'firebase.json'
      - 'firebase.config.js'
      - '.github/workflows/deploy-coach.yml'
      - '!**/*.md'
      - '!**/*.txt'
      - '!**/*.bak*'
      - '!docs/**'

concurrency:
  group: coach-${{ github.event_name == 'workflow_dispatch' && inputs.production && 'production' || 'preview' }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Initialize pinned Plan source
        run: git submodule update --init modules/plan

      # plan-dev hält nur noch das Plan-Eigene; Gemeinsames kommt per Overlay aus fitness-dev
      # (modules/plan/vite-fitness-overlay.mjs). Stand: modules/plan/fitness.ref (Branch oder SHA).
      # website/ (daniel-vitaltrainer-firebase, privat): Coach-Dateien und 6pack.html
      # Zugriff per read-only SSH-Deploy-Key (WEBSITE_DEPLOY_KEY), GitHub App-/PAT-los.
      - name: website auschecken
        uses: actions/checkout@v4
        with:
          repository: nimmsel23/daniel-vitaltrainer-firebase
          ref: main
          path: website
          ssh-key: ${{ secrets.WEBSITE_DEPLOY_KEY }}

      - name: fitness-dev-Stand lesen
        id: fitref
        run: echo "ref=$(tr -d '[:space:]' < modules/plan/fitness.ref)" >> "$GITHUB_OUTPUT"

      - name: fitness-dev auschecken
        uses: actions/checkout@v4
        with:
          repository: nimmsel23/fitness-dev
          ref: ${{ steps.fitref.outputs.ref }}
          path: .fitness-dev
          token: ${{ secrets.GH_SUBMODULE_TOKEN || secrets.GITHUB_TOKEN }}

      - name: FITNESS_ROOT setzen
        run: echo "FITNESS_ROOT=$GITHUB_WORKSPACE/.fitness-dev" >> "$GITHUB_ENV"

      # fitness/catalog/kb ist lokal SSH-Submodul (fitness.git). SOT: nimmsel23/fitness
      # (nicht mehr aus fitness-dev — dort wurde das Paket entfernt).
      - name: Checkout fitness KB (SOT)
        uses: actions/checkout@v4
        with:
          repository: nimmsel23/fitness
          ref: main
          path: fitness-kb
          submodules: recursive

      - name: Fitness-KB einhängen
        run: |
          mkdir -p fitness/catalog
          # Checkout legt fitness/catalog/kb als leeres Submodul-Verzeichnis an;
          # ln -sfn würde sonst eine Link-Datei *innerhalb* anlegen.
          rm -rf fitness/catalog/kb
          ln -sfn "$GITHUB_WORKSPACE/fitness-kb" fitness/catalog/kb
          test -d fitness/catalog/kb/exercises/6pack
          echo "FITNESS_KB_DIR=$GITHUB_WORKSPACE/fitness/catalog/kb" >> "$GITHUB_ENV"
          echo "KB @ $(git -C fitness-kb rev-parse --short HEAD)"

      - uses: pnpm/action-setup@v4
        with:
          version: 11.3.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # build-sixpack-data.mjs erwartet ein 6pack-Nachbar-Checkout (REPO_ROOT/../6pack-{app,dev});
      # actions/checkout verweigert Pfade außerhalb des Workspace, daher direkter Klon.
      - name: sixpack-dev auschecken (KB-Daten)
        run: |
          git clone --depth 1 --branch master https://github.com/nimmsel23/6pack-dev.git ../6pack-dev
          pnpm --dir ../6pack-dev install --frozen-lockfile --ignore-scripts

      - name: Install
        run: |
          cat > pnpm-workspace.yaml <<'YAML'
          packages: ["."]
          nodeLinker: hoisted
          verifyDepsBeforeRun: false
          ignoreScripts: true
          overrides:
            rollup: 4.68.0
            rolldown: 1.2.16
            vite: 8.3.6
            "@vitejs/plugin-react": 6.2.1
            "@firebase/util": "^1.12.1"
            "@grpc/grpc-js@<1.13.6": "^1.14.6"
            "brace-expansion@<1.1.20": "^1.1.20"
            "brace-expansion@>=2.0.0 <2.1.7": "^2.1.7"
            "brace-expansion@>=5.0.0 <5.0.11": "^5.0.11"
            "postcss-selector-parser@<6.1.5": "^6.1.5"
            "glob@<14.0.2": "^14.0.3"
            "minimatch@<11.0.1": "^11.0.4"
            "fast-uri@<3.1.9": "^3.1.9"
            "node-forge@<=1.4.0": "^1.4.3"
            "serialize-javascript@<7.1.3": "^7.1.3"
            "uuid@<11.1.1": "^11.1.1"
          YAML
          sed -i 's/^          //' pnpm-workspace.yaml
          pnpm install --frozen-lockfile --ignore-scripts --config.minimumReleaseAge=0

      # *.generated.js sind gitignored; build:firebase:coach erzeugt sie nicht selbst
      - name: Coach functional tests
        run: pnpm run test:coach:functional

      - name: KB-Daten generieren
        run: pnpm run build:kb-data

      - name: Build (Coach)
        run: pnpm run build:firebase:coach

      - name: Record deployed source
        run: node -e "require('fs').writeFileSync('dist-coach/release.json',JSON.stringify({app:'coach',commit:process.env.GITHUB_SHA,builtAt:new Date().toISOString()})+'\n')"

      - name: Deploy hosting:coach
        env:
          PRODUCTION: ${{ github.event_name == 'workflow_dispatch' && inputs.production }}
          SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_FITNESS_AOS }}
        run: |
          if [ -z "$SERVICE_ACCOUNT" ]; then
            echo "::error::Secret FIREBASE_SERVICE_ACCOUNT_FITNESS_AOS fehlt."
            exit 1
          fi
          if [ "$PRODUCTION" = true ] && [ "$GITHUB_REF" != refs/heads/dev ]; then
            echo "::error::Production releases must use the Coach dev branch."
            exit 1
          fi
          trap 'rm -f "$RUNNER_TEMP/sa.json"' EXIT
          printf '%s' "$SERVICE_ACCOUNT" > "$RUNNER_TEMP/sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json"
          if [ "$PRODUCTION" = true ]; then
            npx --yes firebase-tools@13 deploy --only hosting:coach --project fitness-aos --non-interactive
          else
            npx --yes firebase-tools@13 hosting:channel:deploy dev --only coach --expires 24h --project fitness-aos --non-interactive
          fi
