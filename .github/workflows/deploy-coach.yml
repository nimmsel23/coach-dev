# Deploy der Coach-App (Firebase Hosting, Target `coach` -> https://vos-coach.web.app)
# bei jedem Push auf `dev`, der Frontend-Code berührt.
#
# Ersetzt die geerbten Fitness-Workflows (liegen jetzt in workflows.disabled/):
# die bauten die Fitness-App über das vitalos-Meta-Repo, nicht die Coach-App.
# Firestore-Rules werden hier nie deployed (SSOT: ~/vitalos/firestore.rules).
#
# Einmalig nötig: Repo-Secret FIREBASE_SERVICE_ACCOUNT_FITNESS_AOS
# (Service-Account-JSON mit Rolle "Firebase Hosting Admin" für Projekt fitness-aos).
# Fehlt das Secret, baut der Job nur und überspringt den Deploy mit Warnung.
#
# PREVIEW statt Live (Regel 2026-10-16): echte Prod-URLs (vos-*.web.app) werden nur noch
# aus dem Branch `vitalos` der Meta-Repo-Checkouts (~/vitalos/*-app) deployt. Dieser
# Workflow veröffentlicht auf dem Branch `dev` ausschließlich einen 24h-Preview-Channel `dev`.

name: Preview Coach

on:
  workflow_dispatch:
  push:
    branches: [dev]
    paths:
      - 'src/**'
      - 'coach.html'
      - 'public-coach/**'
      - 'fitness/catalog/kb/**'
      - 'scripts/**'
      - 'vite.config.js'
      - 'tailwind.config.cjs'
      - 'postcss.config.cjs'
      - 'package.json'
      - 'firebase.json'
      - 'firebase.config.js'
      - '.github/workflows/deploy-coach.yml'
      - '!**/*.md'
      - '!**/*.txt'
      - '!**/*.bak*'
      - '!docs/**'

concurrency:
  group: deploy-coach
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install
        run: npm install --no-audit --no-fund --ignore-scripts

      # *.generated.js sind gitignored; build:firebase:coach erzeugt sie nicht selbst
      - name: KB-Daten generieren
        run: npm run build:kb-data

      - name: Build (Coach)
        run: npm run build:firebase:coach

      - name: Preview hosting:coach (24h-Channel dev)
        env:
          SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_FITNESS_AOS }}
        run: |
          if [ -z "$SERVICE_ACCOUNT" ]; then
            echo "::warning::Secret FIREBASE_SERVICE_ACCOUNT_FITNESS_AOS fehlt - Deploy übersprungen."
            exit 0
          fi
          printf '%s' "$SERVICE_ACCOUNT" > "$RUNNER_TEMP/sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json"
          npx --yes firebase-tools@13 hosting:channel:deploy dev --only coach --expires 24h --project fitness-aos --non-interactive
          rm -f "$RUNNER_TEMP/sa.json"
