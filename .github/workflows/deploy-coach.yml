# Coach owns its preview and production Hosting releases.
# Firestore rules remain owned by VitalOS.

name: Deploy Coach

on:
  workflow_dispatch:
    inputs:
      production:
        description: Deploy to the live Coach site
        type: boolean
        default: false
  push:
    branches: [dev]
    paths:
      - '.gitmodules'
      - 'vitalos'
      - 'src/**'
      - 'coach.html'
      - 'public-coach/**'
      - 'fitness/catalog/kb/**'
      - 'scripts/**'
      - 'vite.config.js'
      - 'tailwind.config.cjs'
      - 'postcss.config.cjs'
      - 'package.json'
      - 'mini-app.json'
      - 'firebase.json'
      - 'firebase.config.js'
      - '.github/workflows/deploy-coach.yml'
      - '!**/*.md'
      - '!**/*.txt'
      - '!**/*.bak*'
      - '!docs/**'

concurrency:
  group: coach-${{ github.event_name == 'workflow_dispatch' && inputs.production && 'production' || 'preview' }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.3.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install
        # The optional alias package exists only in the VitalOS workspace.
        # Standalone Vite already provides its own fallback aliases.
        run: |
          node -e "const fs=require('fs');const p=JSON.parse(fs.readFileSync('package.json'));delete p.optionalDependencies?.['@vos/cross-app-aliases'];fs.writeFileSync('package.json',JSON.stringify(p,null,2)+'\n')"
          printf 'packages: ["."]\nnodeLinker: hoisted\nverifyDepsBeforeRun: false\nignoreScripts: true\n' > pnpm-workspace.yaml
          pnpm install --no-frozen-lockfile --ignore-scripts

      # *.generated.js sind gitignored; build:firebase:coach erzeugt sie nicht selbst
      - name: KB-Daten generieren
        run: pnpm run build:kb-data

      - name: Build (Coach)
        run: pnpm run build:firebase:coach

      - name: Deploy hosting:coach
        env:
          PRODUCTION: ${{ github.event_name == 'workflow_dispatch' && inputs.production }}
          SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_FITNESS_AOS }}
        run: |
          if [ -z "$SERVICE_ACCOUNT" ]; then
            echo "::error::Secret FIREBASE_SERVICE_ACCOUNT_FITNESS_AOS fehlt."
            exit 1
          fi
          if [ "$PRODUCTION" = true ] && [ "$GITHUB_REF" != refs/heads/dev ]; then
            echo "::error::Production releases must use the Coach dev branch."
            exit 1
          fi
          trap 'rm -f "$RUNNER_TEMP/sa.json"' EXIT
          printf '%s' "$SERVICE_ACCOUNT" > "$RUNNER_TEMP/sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json"
          if [ "$PRODUCTION" = true ]; then
            npx --yes firebase-tools@13 deploy --only hosting:coach --project fitness-aos --non-interactive
          else
            npx --yes firebase-tools@13 hosting:channel:deploy dev --only coach --expires 24h --project fitness-aos --non-interactive
          fi
