# Solo-Mini-Apps aus fitness-dev, je Tab eine App (vos-training, vos-logbuch, vos-review, vos-atlas,
# vos-touren, vos-setup, vos-anamnese, vos-fokus). SSOT ist scripts/miniapps.json: Eintrag je App mit
# Tab, Hosting-Site und den View-Ordnern, die sie betreffen. Gebaut wird mit
# `pnpm run build:miniapp <id>` (vite --mode <id>, die anderen Views sind per soloStubPlugin ausgestubbt).
# Neue App = Eintrag in miniapps.json + .env.<id> + Hosting-Target <id> + Icon (siehe _note in der Datei);
# an diesem Workflow ändert sich nichts.
#
# Push auf master deployt nur die betroffenen Apps (Schritt "Betroffene Apps"):
#   - Dateien in den "paths" einer App                         -> diese App
#   - solo-icons/<id>/ oder .env.<id>                          -> diese App
#   - gemeinsamer Code (src/ ausser src/views/, scripts/, vite.config.js, package.json, Lockfile,
#     mini-app.json, firebase.json, miniapps.json, diese Datei) -> alle Apps
#   - Änderungen in anderen Views erreichen die Solo-Builds nicht (ausgestubbt)  -> kein Deploy
# workflow_dispatch: alle oder eine App gezielt; mit `before` (so startet automerge.yml nach dem Release-Merge)
# wie ein Push per Diff. Ein Merge mit GITHUB_TOKEN löst keinen push-Trigger aus, deshalb der Dispatch.
#
# learn/plan/6pack/skills haben eigene Repos und Sites und stehen nicht in der Tabelle.
# Aufbau wie deploy-master.yml (Nachbarn auf master, je eigener Lockfile, FIREBASE_CONFIG-Secret).

name: Live Deploy (Mini-Apps je Tab)

'on':
  workflow_dispatch:
    inputs:
      app:
        description: "Welche Mini-App? (all oder eine id aus scripts/miniapps.json)"
        type: string
        default: all
      before:
        description: "Optional: Commit vor dem Merge. Gesetzt = nur die vom Diff betroffenen Apps (setzt automerge.yml)"
        type: string
        default: ''
  push:
    branches:
      - master
    paths:
      - 'src/**'
      - 'scripts/**'
      - 'vite.config.js'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'mini-app.json'
      - 'firebase.json'
      - 'solo-icons/**'
      - '.env.*'
      - '.github/workflows/deploy-miniapps.yml'

concurrency:
  group: live-deploy-miniapps
  cancel-in-progress: false

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.apps.outputs.matrix }}
      any: ${{ steps.apps.outputs.any }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Betroffene Apps
        id: apps
        env:
          BEFORE: ${{ github.event.before }}
          INPUT_APP: ${{ inputs.app }}
          INPUT_BEFORE: ${{ inputs.before }}
        run: |
          set -euo pipefail
          SHARED='^(src/|scripts/|vite\.config\.js$|package\.json$|pnpm-lock\.yaml$|mini-app\.json$|firebase\.json$|\.github/workflows/deploy-miniapps\.yml$)'
          all_ids=$(jq -r '.apps[].id' scripts/miniapps.json)
          selected=""
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ] && [ -z "${INPUT_BEFORE:-}" ]; then
            if [ -z "${INPUT_APP:-}" ] || [ "$INPUT_APP" = "all" ]; then selected="$all_ids"
            else
              echo "$all_ids" | grep -qx "$INPUT_APP" || { echo "::error::unbekannte App: $INPUT_APP"; exit 1; }
              selected="$INPUT_APP"
            fi
          else
            BEFORE="${INPUT_BEFORE:-$BEFORE}"   # dispatch mit before (Automerge) diffed wie ein Push
            if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
              changed=$(git diff-tree --no-commit-id --name-only -r "$GITHUB_SHA")
            else
              changed=$(git diff --name-only "$BEFORE" "$GITHUB_SHA")
            fi
            echo "$changed"
            # gemeinsamer Code: src/ ausser src/views/ (plus Build-Konfiguration) betrifft alle Apps
            if echo "$changed" | grep -Ev '^src/views/' | grep -Eq "$SHARED" \
               || echo "$changed" | grep -qx 'scripts/miniapps.json'; then
              selected="$all_ids"
            else
              for id in $all_ids; do
                prefixes=$(jq -r --arg id "$id" '.apps[] | select(.id==$id) | .paths[]' scripts/miniapps.json | sed 's/\./\\./g' | paste -sd'|')
                if echo "$changed" | grep -Eq "^(${prefixes}|solo-icons/${id}/|\.env\.${id}$)"; then
                  selected="$selected $id"
                fi
              done
            fi
          fi
          ids=$(echo "$selected" | tr ' ' '\n' | sed '/^$/d' | sort -u | paste -sd' ')
          echo "Deploy: ${ids:-keine}"
          matrix=$(for id in $ids; do jq -c --arg id "$id" '.apps[] | select(.id==$id) | {id, site}' scripts/miniapps.json; done | jq -sc '{include: .}')
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          if [ -n "$ids" ]; then echo "any=true" >> "$GITHUB_OUTPUT"; else echo "any=false" >> "$GITHUB_OUTPUT"; fi

  deploy:
    needs: detect
    if: needs.detect.outputs.any == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix: ${{ fromJSON(needs.detect.outputs.matrix) }}
    steps:
      - name: Checkout fitness-dev
        uses: actions/checkout@v7
        with:
          path: fitness-dev

      - name: Checkout Nachbarn (master)
        run: |
          set -euo pipefail
          for repo in plan-dev 6pack-dev skills-dev learn-dev relax-dev; do
            git clone --depth 1 --branch master "https://github.com/nimmsel23/${repo}.git" "$repo"
            echo "$repo @ $(git -C "$repo" rev-parse --short HEAD)"
          done

      - uses: pnpm/action-setup@v6
        with:
          version: 11.3.0

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: fitness-dev/pnpm-lock.yaml

      - name: Install (fitness-dev, eigener Lockfile)
        working-directory: fitness-dev
        run: pnpm install --frozen-lockfile

      - name: Install Nachbarn (je eigener Lockfile)
        run: |
          set -euo pipefail
          for repo in plan-dev 6pack-dev skills-dev learn-dev relax-dev; do
            echo "::group::$repo"
            if [ -f "$repo/pnpm-lock.yaml" ]; then
              (cd "$repo" && pnpm install --frozen-lockfile --ignore-scripts)
            elif [ -f "$repo/package.json" ]; then
              (cd "$repo" && pnpm install --no-frozen-lockfile --ignore-scripts)
            fi
            echo "::endgroup::"
          done

      - name: Firebase config bereitstellen (Secret)
        working-directory: fitness-dev
        env:
          FIREBASE_CONFIG: ${{ secrets.FIREBASE_CONFIG }}
        run: |
          test -n "$FIREBASE_CONFIG" || { echo "::error::Secret FIREBASE_CONFIG fehlt"; exit 1; }
          printf '%s\n' "$FIREBASE_CONFIG" > firebase.config.js

      - name: Build ${{ matrix.id }}
        working-directory: fitness-dev
        run: pnpm run build:miniapp ${{ matrix.id }}

      - name: Deploy ${{ matrix.id }} (${{ matrix.site }})
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_FITNESS_AOS || secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: fitness-aos
          entryPoint: fitness-dev
          target: ${{ matrix.id }}
          channelId: live
