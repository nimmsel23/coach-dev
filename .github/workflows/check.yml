# Check für Coach: Build auf jedem PR/dev-Push, ohne Deploy und ohne Firebase-Secrets.
# Gleiche Build-Kette wie deploy-coach.yml (KB + Plan-Pin + npm run build:firebase:coach).

name: Check (Coach)

on:
  workflow_dispatch:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Initialize pinned Plan source
        run: git submodule update --init modules/plan

      - name: website auschecken
        uses: actions/checkout@v4
        with:
          repository: nimmsel23/daniel-vitaltrainer-firebase
          ref: main
          path: website
          ssh-key: ${{ secrets.WEBSITE_DEPLOY_KEY }}

      - name: fitness-dev-Stand lesen
        id: fitref
        run: echo "ref=$(tr -d '[:space:]' < modules/plan/fitness.ref)" >> "$GITHUB_OUTPUT"

      - name: fitness-dev auschecken
        uses: actions/checkout@v4
        with:
          repository: nimmsel23/fitness-dev
          ref: ${{ steps.fitref.outputs.ref }}
          path: .fitness-dev
          token: ${{ secrets.GH_SUBMODULE_TOKEN || secrets.GITHUB_TOKEN }}

      - name: FITNESS_ROOT setzen
        run: echo "FITNESS_ROOT=$GITHUB_WORKSPACE/.fitness-dev" >> "$GITHUB_ENV"

      - name: Checkout fitness KB (SOT)
        uses: actions/checkout@v4
        with:
          repository: nimmsel23/fitness
          ref: main
          path: fitness-kb
          submodules: recursive

      - name: Fitness-KB einhängen
        run: |
          mkdir -p fitness/catalog
          rm -rf fitness/catalog/kb
          ln -sfn "$GITHUB_WORKSPACE/fitness-kb" fitness/catalog/kb
          test -d fitness/catalog/kb/exercises/6pack
          echo "FITNESS_KB_DIR=$GITHUB_WORKSPACE/fitness/catalog/kb" >> "$GITHUB_ENV"
          echo "KB @ $(git -C fitness-kb rev-parse --short HEAD)"

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: sixpack-dev auschecken (KB-Daten)
        run: |
          git clone --depth 1 --branch master https://github.com/nimmsel23/6pack-dev.git ../6pack-dev

      - name: Install
        run: |
          npm install -g npm@12.2.2  # gleiche npm-Version wie lokal (Lockfile-Format)
          npm ci --ignore-scripts --no-audit --no-fund
          # 6pack-dev/catalogContent.mjs importiert js-yaml aus seinem eigenen Ordner
          mkdir -p ../6pack-dev/node_modules
          ln -sfn "$PWD/node_modules/js-yaml" ../6pack-dev/node_modules/js-yaml

      - name: Tooling (Biome format scripts/)
        run: npm run tooling:biome

      - name: Tooling (knip report)
        continue-on-error: true
        run: npm run tooling:knip



      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Workspace runtime tests
        run: |
          python -m pip install 'fastapi>=0.115,<1' 'httpx>=0.27,<1'
          python -m unittest src.test_csuite_runtime src.test_coo_operations src.test_coo_calendar src.test_coo_approvals src.test_coo_tools

      - name: Coach functional tests
        run: npm run test:coach:functional

      - name: KB-Daten generieren
        run: npm run build:kb-data

      - name: Build (Coach)
        run: npm run build:firebase:coach
