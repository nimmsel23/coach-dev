# Auto-Merge bei grünem Check:
#   - Dependabot-PRs (-> dev): Squash
#   - Release-PR dev -> master (vos-release-pr): Merge-Commit (kein Squash, sonst driftet dev),
#     danach werden deploy-master.yml und deploy-miniapps.yml per workflow_dispatch gestartet, weil ein
#     Merge mit GITHUB_TOKEN keinen push-Trigger auslöst (die Mini-Apps bekommen den Stand vor dem Merge
#     als `before`, damit sie nur die betroffenen Apps deployen).
# Rot bleibt liegen. Läuft als workflow_run im Kontext des Default-Branch und checkt nie
# PR-Code aus.

name: Auto-Merge (grüner Check)

on:
  workflow_run:
    workflows: ["Check (Fitness)"]
    types: [completed]

permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  merge:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request' &&
      (github.event.workflow_run.head_branch == 'dev' ||
       startsWith(github.event.workflow_run.head_branch, 'dependabot/'))
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      BRANCH: ${{ github.event.workflow_run.head_branch }}
      SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - name: Mergen, wenn der grüne Lauf dem aktuellen PR-Stand entspricht
        run: |
          if [ "$BRANCH" = dev ]; then base=master; flag=--merge; else base=dev; flag="--squash --delete-branch"; fi
          pr=$(gh pr list -R "$REPO" --head "$BRANCH" --base "$base" --state open --json number,headRefOid \
            --jq ".[] | select(.headRefOid == \"$SHA\") | .number")
          [ -n "$pr" ] || { echo "Kein offener PR mit Stand $SHA (veraltet oder schon gemergt)."; exit 0; }
          before=$(gh pr view "$pr" -R "$REPO" --json baseRefOid --jq .baseRefOid)   # master vor dem Merge (für den Diff der Mini-Apps)
          gh pr merge "$pr" -R "$REPO" $flag
          if [ "$base" = master ]; then
            gh workflow run deploy-master.yml -R "$REPO" --ref master
            gh workflow run deploy-miniapps.yml -R "$REPO" --ref master -f before="$before"
          fi
