# Managed dependency updates; vendored mini-app-shell copies are maintained at their source.
version: 2
updates:
- package-ecosystem: github-actions
  schedule:
    interval: weekly
    day: monday
    time: 07:00
    timezone: Europe/Vienna
  open-pull-requests-limit: 5
  commit-message:
    prefix: ci
  directory: /
  groups:
    actions:
      patterns:
      - '*'
- package-ecosystem: npm
  schedule: &id001
    interval: weekly
    day: monday
    time: 07:00
    timezone: Europe/Vienna
  open-pull-requests-limit: 5
  commit-message: &id002
    prefix: deps
  directories:
  - /
  - /functions
  cooldown: &id003
    default-days: 7
  groups: &id004
    minor-and-patch:
      update-types:
      - minor
      - patch
- package-ecosystem: pip
  schedule: *id001
  open-pull-requests-limit: 5
  commit-message: *id002
  cooldown: *id003
  groups: *id004
  directory: /
