  coaching_notes:
  - Nimm einen stabilen Stuetz auf den Holmen ein, ziehe die Schultern aktiv nach
    unten und halte den Brustkorb angehoben.
  - Lehne den Oberkoerper leicht bis deutlich nach vorn, damit die Bewegung staerker
    aus der Brust statt fast nur aus dem Trizeps gearbeitet wird.
  - Lass die Ellbogen kontrolliert beugen und fuehre sie leicht nach aussen, ohne
    die Schultern nach vorn kollabieren zu lassen.
  - Senke dich nur so tief ab, wie du Spannung in Brust und Schulter kontrollieren
    kannst und die vordere Schulter dabei schmerzfrei bleibt.
  - Druecke dich aus der tiefen Position kraftvoll nach oben, ohne Schwung aus den
    Beinen oder aus einem Nachschwingen des Rumpfs zu holen.
  - Halte Rippen unten und Bauchspannung konstant, damit der Koerper ruhig bleibt
    und du nicht ins Hohlkreuz faellst.
  - Beende die Wiederholung oben mit gestreckten Armen und aktiver Schulterdepression,
    aber ohne die Gelenke aggressiv zu verriegeln.
  common_errors:
  - Zu aufrecht bleiben, wodurch die Uebung eher zum Trizeps-Dip wird und die Brust
    weniger Last bekommt.
  - Die Schultern in der unteren Position nach vorn kippen oder hochziehen, was die
    vordere Schulter unnoetig belastet.
  - Sich tiefer fallen lassen, als Mobilitaet und Schulterkontrolle erlauben, nur
    um kuenstlich mehr Bewegungsumfang zu erzwingen.
  - Mit Schwung arbeiten und den Koerper vor und zurueck schwingen, statt die Wiederholung
    sauber zu kontrollieren.
  - Die Ellbogen extrem weit abspreizen, sodass Spannung verloren geht und die Schulter
    mechanisch unguenstig belastet wird.
  - Oben passiv im Schulterguertel haengen, anstatt die Holme aktiv wegzudruecken
    und Spannung zu halten.
  - Bauch- und Gesaessspannung verlieren, wodurch der Koerper instabil wird und die
    Kraftuebertragung schlechter ausfaellt.
