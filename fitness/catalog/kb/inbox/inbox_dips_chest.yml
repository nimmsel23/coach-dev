  coaching_notes:
  - Positioniere dich mit gestreckten Armen auf den Barren, die Schultern aktiv nach
    unten gedrückt und leicht nach hinten gezogen. Lehne den Oberkörper je nach Brustfokus
    leicht bis deutlich nach vorn, um die Spannung auf die Brustmuskulatur zu lenken.
  - Beginne die Abwärtsbewegung kontrolliert, indem du die Ellbogen beugst und sie
    leicht nach außen führst. Halte dabei den Oberkörper weiterhin nach vorn gelehnt
    und die Schultern aktiv stabilisiert, um sie nicht nach vorn kollabieren zu lassen.
  - Senke dich nur so tief ab, wie du die Spannung in der Brust und die Kontrolle
    über deine Schulterblätter vollständig aufrechterhalten kannst. Ein tieferer Winkel
    kann den vorderen Schulterkopf unnötig belasten.
  - Spüre in der untersten Position eine gute Dehnung in der Brust. Drücke dich dann
    kraftvoll und explosiv über Brust und Trizeps zurück in die Ausgangsposition.
  - Vermeide es, Schwung aus den Beinen oder durch ein Nachschwingen des Rumpfes zu
    holen. Die Bewegung sollte aus den Armen und dem Oberkörper generiert werden.
  - Strecke die Arme oben vollständig, aber ohne die Gelenke zu überstrecken oder
    passiv in den Schultern zu hängen. Halte die Schultern weiterhin aktiv nach unten
    gedrückt.
  - Achte während der gesamten Übung auf eine konstante Rumpfspannung (Bauch und unterer
    Rücken), um den Körper stabil zu halten und ein Hohlkreuz zu vermeiden.
  common_errors:
  - 'Zu aufrecht bleiben: Dadurch verlagert sich die Belastung stark auf den Trizeps
    und die vordere Schulter, wodurch die Brust weniger effektiv trainiert wird.'
  - 'Schultern hochziehen oder nach vorn fallen lassen: Dies belastet die Rotatorenmanschette
    und den vorderen Schulterbereich übermäßig und erhöht das Verletzungsrisiko.'
  - 'Zu tief absinken: Wenn die Mobilität oder Kontrolle der Schulter nicht ausreicht,
    führt dies zu einer ungesunden Dehnung und Instabilität im Schultergelenk.'
  - 'Schwung holen: Durch Schwingen mit dem Körper oder den Beinen wird die Muskelspannung
    reduziert und die Effektivität der Übung verringert.'
  - 'Ellbogen zu weit abspreizen: Dies kann die Schultergelenke überlasten und die
    Spannung in der Brust reduzieren, anstatt sie zu erhöhen.'
  - 'Oben in den Schultern passiv hängen: Die aktive Schulterdepression und -stabilisation
    sollte auch in der obersten Position beibehalten werden, um Spannung zu halten
    und Gelenke zu schützen.'
  - 'Verlust der Rumpfspannung: Ein instabiler Rumpf führt zu schlechterer Kraftübertragung
    und kann den unteren Rücken überlasten, besonders bei einer geneigten Haltung.'
