  coaching_notes:
  - Stelle den Sitz so ein, dass sich die Griffe bei entspanntem Oberkörper auf Höhe
    deiner Brust befinden. Deine Füße sollten dabei stabil auf dem Boden oder den
    Fußstützen stehen.
  - Fasse die Griffe mit einem festen Griff, wobei deine Handgelenke gerade und neutral
    bleiben sollten. Halte deinen Rücken während der gesamten Bewegung fest am Rückenpolster.
  - Drücke die Griffe kontrolliert nach vorne, indem du deine Brustmuskulatur aktiv
    anspannst. Atme dabei aus. Achte darauf, die Bewegung flüssig und ohne Rucken
    auszuführen.
  - Am Ende der Drückbewegung solltest du eine maximale Kontraktion in deiner Brust
    spüren. Vermeide es, deine Ellbogen vollständig durchzustrecken und die Gelenke
    zu blockieren.
  - Lasse die Griffe langsam und kontrolliert in die Ausgangsposition zurückkehren,
    während du einatmest. Widerstehe dem Gewicht aktiv auf dem Rückweg, um die exzentrische
    Phase zu nutzen.
  - Achtre auf eine leichte Dehnung in der Brustmuskulatur am Ende der Rückführbewegung,
    ohne dabei die Schultergelenke zu überdehnen.
  common_errors:
  - '**Falsche Sitzeinstellung:** Wenn der Sitz zu hoch oder zu niedrig ist, kann
    dies die Schultern unnötig belasten oder die Aktivierung der Brustmuskulatur reduzieren.'
  - '**Rücken vom Polster abheben:** Das Abheben des Rückens vom Polster reduziert
    die Stabilität und kann zu einer Überstreckung der Lendenwirbelsäule führen.'
  - '**Zu schnelles oder ruckartiges Drücken:** Eine zu schnelle Ausführung oder ruckartige
    Bewegungen mindern die Effektivität der Übung und erhöhen das Verletzungsrisiko.'
  - '**Ellenbogen blockieren:** Das vollständige Durchstrecken der Ellbogen am Endpunkt
    der Bewegung belastet die Gelenke unnötig und kann zu Verletzungen führen.'
  - '**Keine Kontrolle auf dem Rückweg:** Das Gewicht einfach zurückschnellen zu lassen,
    verschenkt das Potenzial der exzentrischen Phase für Muskelwachstum und Kontrolle.'
  - '**Schultern hochziehen:** Wenn die Schultern während der Bewegung zu den Ohren
    gezogen werden, führt dies zu Nackenverspannungen und nimmt Spannung von der Brustmuskulatur.'
