  coaching_notes:
  - Stehe aufrecht mit leicht gebeugten Knien und gespanntem Rumpf. Die Hanteln starten
    seitlich vor dem Oberschenkel, ohne dass du ins Hohlkreuz oder in eine Ruecklage
    ausweichst.
  - Fuehre die Arme in einer leicht nach vorn versetzten Skapulaebene an, nicht exakt
    frontal zur Seite. So bleibt die Schultermechanik meist sauberer und die seitliche
    Schulter kann besser arbeiten.
  - Lass die Ellbogen weich gebeugt und denke daran, die Ellbogen nach aussen und
    oben zu fuehren. Die Haende folgen nur der Linie der Ellbogen, statt die Bewegung
    aktiv aus den Handgelenken zu machen.
  - Hebe kontrolliert nur bis etwa Schulterhoehe oder knapp darunter, solange du die
    Spannung sauber im seitlichen Deltoid halten kannst. Mehr Hoehe verlagert die
    Arbeit haeufig in den oberen Trapezius.
  - Halte die Schultern weg von den Ohren und erzeuge Laenge im Nacken. Die Schulterblaetter
    duerfen sich natuerlich mitbewegen, aber ohne aggressives Hochziehen.
  - Senke die Hanteln bewusst langsamer ab, als du sie anhebst. Die exzentrische Phase
    liefert viel Trainingsreiz und verhindert, dass Schwung die Wiederholung uebernimmt.
  - Waehle eine Last, mit der jede Wiederholung gleich aussieht. Beim Seitheben ist
    saubere Hebelkontrolle wichtiger als schwere Hanteln.
  common_errors:
  - Zu schwere Hanteln, sodass der Oberkoerper nach hinten lehnt oder aus den Beinen
    und der Huefte angeschwungen wird.
  - Die Schultern waehrend der Aufwaertsbewegung zu den Ohren hochziehen, wodurch
    der obere Trapezius die Arbeit des seitlichen Deltoids uebernimmt.
  - Die Arme deutlich ueber Schulterhoehe anzuheben, obwohl dabei die Zielspannung
    verloren geht und die Bewegung unsauber wird.
  - Die Ellbogen komplett durchzustrecken oder die Handgelenke stark abzuknicken,
    was den Hebel unnoetig verschlechtert und die Kontrolle reduziert.
  - Die Hanteln mit starker Innenrotation zu fuehren und das klassische Wasser-ausgiessen
    zu erzwingen, was die Schulterposition oft eher verschlechtert.
  - Die Abwaertsphase einfach fallen zu lassen, statt die Last aktiv und kontrolliert
    zurueckzufuehren.
