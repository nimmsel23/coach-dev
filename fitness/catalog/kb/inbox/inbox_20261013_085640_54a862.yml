  instructions:
  - 'Grab the pull-up bar with the palms facing forward using the prescribed grip.
    Note on grips: For a wide grip, your hands need to be spaced out at a distance
    wider than your shoulder width. For a medium grip, your hands need to be spaced
    out at a distance equal to your shoulder width and for a close grip at a distance
    smaller than your shoulder width.'
  - As you have both arms extended in front of you holding the bar at the chosen grip
    width, bring your torso back around 30 degrees or so while creating a curvature
    on your lower back and sticking your chest out. This is your starting position.
  - 'Pull your torso up until the bar touches your upper chest by drawing the shoulders
    and the upper arms down and back. Exhale as you perform this portion of the movement.
    Tip: Concentrate on squeezing the back muscles once you reach the full contracted
    position. The upper torso should remain stationary as it moves through space and
    only the arms should move. The forearms should do no other work other than hold
    the bar.'
  - After a second on the contracted position, start to inhale and slowly lower your
    torso back to the starting position when your arms are fully extended and the
    lats are fully stretched.
  - Repeat this motion for the prescribed amount of repetitions.
  coaching_notes:
  - 'Aktiver Start: Beginne aus einem aktiven Hang – Schultern weg von den Ohren,
    Brustbein leicht angehoben, Rumpf stabil. Vermeide ein passives Aushängen in den
    Gelenken.'
  - 'Ellenbogenführung: Konzentriere dich darauf, die Ellenbogen nach unten und hinten
    (in Richtung deiner Hüften) zu ziehen, um die primäre Zugbewegung aus dem Latissimus
    und dem oberen Rücken zu initiieren.'
  - 'Schulterblattkontrolle: Die Schulterblätter aktiv nach unten drücken (Depression)
    und leicht zusammenführen (Retraktion), während du dich hochziehst. Dies schützt
    die Schultern und aktiviert den Rücken effektiv.'
  - 'Rumpfspannung: Halte während der gesamten Bewegung eine stabile Rumpfspannung,
    um ein Hohlkreuz oder unbeabsichtigtes Schwingen des Körpers zu verhindern. Dein
    Körper sollte eine relativ gerade Linie bilden.'
  - 'Volle Bewegungsamplitude: Ziehe dich hoch, bis die obere Brust die Stange berührt
    oder zumindest das Kinn deutlich über der Stange ist, und senke dich dann kontrolliert
    ab, bis die Arme fast vollständig gestreckt sind.'
  - 'Kontrollierte Exzentrik: Die Abwärtsbewegung (Exzentrik) sollte langsam und kontrolliert
    erfolgen. Dies fördert den Kraftaufbau, verbessert die Kontrolle und minimiert
    das Verletzungsrisiko.'
  - 'Griffweite und -tiefe: Ein Griff etwas breiter als schulterbreit ist üblich.
    Halte die Stange fest und tief in der Handfläche, um die Unterarme und den Griff
    optimal zu nutzen und Handgelenkbelastung zu reduzieren.'
  - 'Mind-Muscle Connection: Fühle bewusst, wie dein Latissimus und dein oberer Rücken
    arbeiten. Versuche, die Bewegung nicht nur mit den Armen zu forcieren.'
  common_errors:
  - 'Passives Aushängen: Aus einem völlig passiven Hang starten, ohne vorher Schulterblatt-Depression
    und Rumpfspannung aufzubauen, was die Schultergelenke unnötig belastet.'
  - 'Kipping/Schwung: Die Nutzung von Bein- oder Hüftschwung (Kipping) statt einer
    kontrollierten, muskelgesteuerten Bewegung. Dies reduziert die effektive Belastung
    der Zielmuskulatur.'
  - 'Unvollständige ROM: Teilwiederholungen, bei denen die Arme unten nicht vollständig
    gestreckt oder oben nicht die volle Höhe (Brust zur Stange/Kinn über Stange) erreicht
    wird.'
  - 'Schultern zu den Ohren: Die Schultern während des Hochziehens nach oben zu den
    Ohren ziehen, anstatt sie aktiv nach unten zu drücken und zu stabilisieren, was
    zu Verspannungen im Nacken führen kann.'
  - 'Hohlkreuz/Rippenflare: Verlust der Rumpfspannung, was zu einem starken Hohlkreuz
    oder aufgewölbten Rippen führt. Dies destabilisiert den Körper und reduziert die
    Kraftübertragung.'
  - 'Kopf vorschieben: Den Kopf nach vorne schieben, um das Kinn über die Stange zu
    bekommen, während der Rest des Körpers nicht ausreichend hochgezogen wird.'
  - 'Überbreiter Griff: Ein zu breiter Griff, der die Bewegungsamplitude einschränkt,
    die Schultern ungünstig belastet und die effektive Aktivierung des Latissimus
    reduzieren kann.'
  - 'Exzentrik fallen lassen: Die Abwärtsbewegung unkontrolliert und zu schnell ausführen
    (fallen lassen), was den Trainingseffekt mindert und das Verletzungsrisiko erhöht.'
