      coaching_notes:
      - Stand in the middle of two low pulleys that are opposite to each other and
        place a flat bench right behind you (in perpendicular fashion to you; the
        narrow edge of the bench should be the one behind you). Select the weight
        to be used on each pulley.
      - Now sit at the edge of the flat bench behind you with your feet placed in
        front of your knees.
      - Bend forward while keeping your back flat and rest your torso on the thighs.
      - Have someone give you the single handles attached to the pulleys. Grasp the
        left pulley with the right hand and the right pulley with the left after you
        select your weight. The pulleys should run under your knees and your arms
        will be extended with palms facing each other and a slight bend at the elbows.
        This will be the starting position.
      - While keeping the arms stationary, raise the upper arms to the sides until
        they are parallel to the floor and at shoulder height. Exhale during the execution
        of this movement and hold the contraction for a second.
      - Slowly lower your arms to the starting position as you inhale.
      - 'Repeat for the recommended amount of repetitions. Tip: Maintain upper arms
        perpendicular to torso and a fixed elbow position (10 degree to 30 degree
        angle) throughout exercise.'
