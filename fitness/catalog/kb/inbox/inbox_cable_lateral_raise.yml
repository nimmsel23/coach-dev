  coaching_notes:
  - Stelle dich seitlich zum Kabelzug und positioniere den Griff so, dass der Zug
    bereits in der unteren Position Spannung aufbaut. Das verbessert die Belastungskurve
    gegenüber Kurzhantel-Seitheben.
  - Fasse den Griff mit der arbeitenden Hand, halte den Oberkörper aufrecht und spanne
    Bauch und Gesäß an, damit du nicht zur Gegenseite kippst oder ausweichst.
  - Bewege den Arm in der Skapulaebene leicht vor dem Körper, statt exakt streng seitlich
    hinter der Frontalebene zu arbeiten. Das ist für viele Schultern sauberer und
    angenehmer.
  - Lass den Ellbogen die Bewegung anführen und halte ihn leicht gebeugt. Der Ellbogenwinkel
    bleibt während des Satzes nahezu unverändert.
  - Hebe den Arm kontrolliert bis ungefähr auf Schulterhöhe oder minimal darunter.
    Arbeite nur so hoch, wie du die Spannung auf dem seitlichen Deltoid hältst und
    die Schulter sauber kontrollierst.
  - Halte das Handgelenk neutral und den Griff ruhig. Der Arm hebt sich als Einheit,
    ohne dass du aus dem Unterarm oder mit Schwung arbeitest.
  - Lass das Schulterblatt natürlich mitrotieren, aber ohne die Schulter aktiv hochzuziehen.
    Ziel ist Abduktion mit sauberer Schulterblattkontrolle, nicht ein Shrug.
  - Senke das Gewicht langsam ab und nutze die exzentrische Phase bewusst. Gerade
    beim Kabelzug ist die Spannung unten hoch genug, um die negative Phase effektiv
    auszureizen.
  - Wähle ein Gewicht, mit dem du die letzten Wiederholungen noch ohne Oberkörper-Schwung
    und ohne Verlust der Gelenkposition kontrollieren kannst.
  - Wenn du einarmig arbeitest, kannst du dich mit der freien Hand leicht am Turm
    stabilisieren, um Kompensation zu reduzieren und den seitlichen Deltoid präziser
    zu treffen.
  common_errors:
  - Zu viel Gewicht zu wählen und die Hantel mit Schwung, Beinimpuls oder Seitneigung
    des Oberkörpers nach oben zu beschleunigen.
  - Die Schulter während der Hebebewegung hochzuziehen, sodass der obere Trapezius
    die Arbeit übernimmt und der Zielreiz auf dem seitlichen Deltoid sinkt.
  - Den Arm durch deutliche Innenrotation anzuheben oder die Hand nach unten zu kippen,
    statt das Schultergelenk neutral und stabil zu führen.
  - Den Ellbogenwinkel ständig zu verändern und die Bewegung damit eher in eine Mischung
    aus Seitheben und Zugbewegung zu verwandeln.
  - Zu hoch zu heben, obwohl dabei die Spannung verloren geht oder die Schulterposition
    unsauber wird. Mehr Höhe ist hier nicht automatisch besser.
  - Das Gewicht unten einfach fallen zu lassen und dadurch die exzentrische Kontrolle
    und den Vorteil der konstanten Kabelspannung zu verschenken.
  - Den Arm zu weit hinter dem Körper oder in einer unnatürlichen Linie zu führen,
    was die Schultermechanik häufig verschlechtert.
  - Den Rumpf nicht zu stabilisieren, sodass du zur Gegenseite ausweichst oder ins
    Hohlkreuz gehst, um die Wiederholung zu erleichtern.
  - Mit dem Handgelenk oder Unterarm zu arbeiten, anstatt die Last über den Oberarm
    und den seitlichen Deltoid zu bewegen.
  - Die Bewegung hektisch auszuführen und jede Wiederholung anders zu starten, statt
    eine konstante Zuglinie und reproduzierbare Technik beizubehalten.
