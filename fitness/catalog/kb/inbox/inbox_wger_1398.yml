  coaching_notes:
  - Stelle die Sicherheitsablagen im Power Rack auf die gewünschte Tiefe ein, meistens
    kurz unterhalb deines Sticking Points oder des Punktes, an dem du normalerweise
    umkehrst.
  - Platziere die Langhantel wie bei einem normalen Kniebeugen-Setup (High Bar oder
    Low Bar), die Füße schulterbreit oder etwas weiter, mit leicht ausgedrehten Fußspitzen.
  - Spanne den Rumpf fest an, atme tief ein und beginne die Abwärtsbewegung, indem
    du Hüfte und Knie gleichzeitig beugst, als würdest du dich auf einen Stuhl setzen.
  - Senke die Langhantel kontrolliert ab, bis sie sanft auf den Sicherheitsablagen
    aufliegt. Halte die Spannung im gesamten Körper und die Muskeln unter Last. Vermeide
    es, die Spannung zu verlieren oder komplett zu entspannen.
  - Verweile 1-3 Sekunden auf den Ablagen, um den Stretch-Reflex zu eliminieren und
    die isometrische Kraft zu trainieren.
  - Explodiere dann mit maximaler Kraft aus der tiefen Position nach oben. Konzentriere
    dich darauf, die Hüfte und den Oberkörper gleichzeitig anzuheben, um eine effiziente
    Bewegung zu gewährleisten.
  - Drücke die Knie während der Aufwärtsbewegung leicht nach außen, um eine stabile
    Knieposition zu gewährleisten.
  - Die Pin Squat ist hervorragend geeignet, um einen bestimmten Bereich der Kniebeuge
    zu stärken, den Sticking Point zu überwinden und die explosive konzentrische Kraft
    zu verbessern.
  common_errors:
  - 'Entspannen auf den Pins: Der häufigste Fehler ist das völlige Entspannen und
    Absinken des Oberkörpers, sobald die Stange die Ablagen berührt. Die Spannung
    muss während der gesamten Pause aufrechterhalten werden.'
  - 'Falsche Pin-Höhe: Wenn die Ablagen zu hoch eingestellt sind, wird nicht die volle
    Bewegungsausschlag oder der gewünschte Sticking Point trainiert. Sind sie zu niedrig,
    kann die Aufwärtsbewegung zu lang und ineffektiv sein.'
  - 'Rundrücken: Sowohl während der Abwärtsbewegung als auch beim Verweilen auf den
    Pins oder beim Aufstehen kann der Rücken rund werden, was das Verletzungsrisiko
    erhöht. Halte den Rücken stets gerade und die Brust oben.'
  - 'Knie kollabieren nach innen: Dies deutet auf schwache Abduktoren oder eine schlechte
    Technik hin. Achte darauf, die Knie während der gesamten Bewegung nach außen über
    die Fußspitzen zu drücken.'
  - 'Zu schnelles Heben der Hüfte: Wenn die Hüfte schneller steigt als die Schultern
    (Good Morning Squat), wird die Last übermäßig auf den unteren Rücken verlagert.'
  - 'Von den Pins abprallen: Ein kurzes, federndes Berühren der Pins negiert den Zweck
    der Übung, den Stretch-Reflex zu eliminieren und die statische Kraft aus dem Stillstand
    zu entwickeln.'
  - 'Unzureichendes Bracing: Ein fester Rumpf ist entscheidend für die Stabilität
    und Kraftübertragung. Achte darauf, vor jeder Wiederholung tief einzuatmen und
    den Rumpf anzuspannen.'
  original_description:
  - 'Stelle die Sicherheitsablagen ungefähr auf die Höhe deines Sticking Points ein

    Senke die Stange ab, lasse sie 2 s auf den Ablagen ruhen und halte dabei die Spannung

    Stehe mit maximaler Kraft auf'
