  coaching_notes:
  - Ziehe zuerst die Schulterblätter nach hinten-unten und beginne dann erst mit den
    Armen, damit der Zug aus dem oberen Rücken und Lat kommt.
  - Halte den Brustkorb stabil am Polster, lasse den Nacken lang und vermeide ein
    Vorschieben des Kopfes in der Endposition.
  - Führe die Ellbogen in einem leicht nach unten-hinten gerichteten Bogen, statt
    sie nur nach außen zu reißen, um die Zielmuskulatur sauber zu treffen.
  - 'Nutze den vollen kontrollierten Bewegungsumfang: vorne die Schulterblätter sauber
    protruieren lassen, hinten aktiv zusammenziehen ohne Schwung.'
  - Arbeite seitengetrennt bewusst symmetrisch und kontrolliere Exzentrik und Endposition
    auf beiden Seiten, um Rechts-Links-Differenzen sichtbar zu machen und auszugleichen.
  common_errors:
  - Der Zug wird mit den Armen eingeleitet, bevor die Schulterblätter arbeiten, wodurch
    Bizeps dominiert und Rückenarbeit verloren geht.
  - Zu viel Gewicht führt zu verkürztem Bewegungsradius, Schwung aus dem Oberkörper
    und einer unsauberen Endposition.
  - Die Schultern wandern nach oben zu den Ohren, statt nach hinten-unten zu arbeiten,
    was den oberen Trapez überbetont und die Zielmuskeln entlastet.
  - Der Kopf schiebt nach vorne oder der untere Rücken überstreckt, um die Wiederholung
    künstlich zu beenden.
  - Eine Seite wird schneller oder weiter gezogen als die andere, wodurch Rotationen
    im Rumpf und langfristig Kraftasymmetrien entstehen.
