  instructions:
  - Grab the pull-up bar with the palms facing your torso and a grip closer than the
    shoulder width.
  - 'As you have both arms extended in front of you holding the bar at the chosen
    grip width, keep your torso as straight as possible while creating a curvature
    on your lower back and sticking your chest out. This is your starting position.
    Tip: Keeping the torso as straight as possible maximizes biceps stimulation while
    minimizing back involvement.'
  - 'As you breathe out, pull your torso up until your head is around the level of
    the pull-up bar. Concentrate on using the biceps muscles in order to perform the
    movement. Keep the elbows close to your body. Tip: The upper torso should remain
    stationary as it moves through space and only the arms should move. The forearms
    should do no other work other than hold the bar.'
  - After a second of squeezing the biceps in the contracted position, slowly lower
    your torso back to the starting position; when your arms are fully extended. Breathe
    in as you perform this portion of the movement.
  - Repeat this motion for the prescribed amount of repetitions.
  coaching_notes:
  - Der weite Untergriff-Klimmzug ist eine anspruchsvolle Variante, die den Latissimus
    noch stärker betont als der klassische Klimmzug im Untergriff. Achten Sie auf
    eine saubere Technik, um die Zielmuskulatur optimal zu treffen und die Gelenke
    zu schonen.
  - 'Beginnen Sie aus dem aktiven Hängen: Die Schultern sind entspannt, aber nicht
    passiv hochgezogen; halten Sie eine leichte Spannung im oberen Rücken, um die
    Schulterblätter in einer stabilen Position zu halten.'
  - Der Fokus liegt auf dem Herunterziehen der Ellbogen in Richtung der Hüften, um
    den Latissimus optimal zu aktivieren. Stellen Sie sich vor, Sie möchten den Ellenbogen
    in Ihre Gesäßtasche stecken.
  - 'Konzentrieren Sie sich auf die Bewegung der Schulterblätter: Erst nach unten
    ziehen (Depression), dann zusammenziehen (Retraktion), um die Zugbewegung effektiv
    einzuleiten und den Rücken als Motor zu nutzen.'
  - Vermeiden Sie es, sich nur mit den Armen hochzuziehen. Die Arme sind Helfer, aber
    der Rücken ist der primäre Motor dieser Bewegung.
  - Halten Sie den Körper während der gesamten Bewegung stabil und vermeiden Sie übermäßiges
    Schwingen. Spannung in der Rumpfmuskulatur (Bauch- und Gesäßmuskeln) hilft, den
    Körper in einer geraden Linie zu halten.
  - 'Kontrollieren Sie die exzentrische Phase (das Ablassen): Lassen Sie sich langsam
    und kontrolliert herab, um die Muskelfasern maximal zu stimulieren und die volle
    Bewegungsfreiheit zu nutzen. Zählen Sie dabei 2-3 Sekunden für die Abwärtsbewegung.'
  - Atmen Sie beim Hochziehen aus (konzentrische Phase) und beim Herablassen ein (exzentrische
    Phase).
  common_errors:
  - '**Teilwiederholungen (Partial Reps)**: Sich nicht vollständig herablassen oder
    nicht hoch genug ziehen. Dies reduziert den Bewegungsumfang und die Muskelaktivierung,
    insbesondere des Latissimus.'
  - '**Schwungholen (Kipping)**: Den Körper nutzen, um Schwung zu erzeugen und die
    Bewegung zu erleichtern. Dies nimmt die Spannung von den Zielmuskeln und kann
    das Verletzungsrisiko, insbesondere für die Schultern und die Wirbelsäule, erhöhen.'
  - '**Schulter hochziehen/einfallen lassen (Shoulder Shrugging/Passive Hang)**: Am
    Anfang der Bewegung die Schultern passiv hängen lassen (kein aktives Hängen) oder
    sie beim Hochziehen zu den Ohren ziehen. Die Schultern sollten aktiv stabilisiert
    und bewusst nach unten gezogen werden, um den Nacken zu entlasten und die Rückenmuskulatur
    zu aktivieren.'
  - '**Fehlende Rumpfspannung**: Den Körper durchhängen lassen oder stark schwingen.
    Dies mindert die Effektivität der Übung, da die Stabilität verloren geht, und
    erhöht das Verletzungsrisiko für den unteren Rücken.'
  - '**Nur Arme nutzen**: Sich primär mit Bizeps und Unterarmen hochziehen, anstatt
    den Rücken zu aktivieren. Konzentrieren Sie sich bewusst auf die Latissimus-Aktivierung,
    indem Sie die Ellbogen nach unten und hinten ziehen.'
  - '**Zu schnelles Ablassen**: Die exzentrische Phase unkontrolliert durchführen
    oder sich einfach fallen lassen. Die kontrollierte Negativbewegung ist entscheidend
    für den Muskelaufbau und die Gelenkgesundheit.'
  - '**Ellbogen zu weit auseinander / nicht nach unten führen**: Wenn die Ellbogen
    nicht bewusst nach unten und hinten geführt werden, geht die primäre Aktivierung
    des Latissimus verloren und die Belastung verschiebt sich unnötig auf die Schultergelenke.'
