  coaching_notes:
  - Aufrecht sitzen und den Brustkorb anheben, sodass die Wirbelsaeule waehrend der
    ganzen Wiederholung neutral bleibt.
  - 'Ziehe den Griff zuerst ueber die Schulterbewegung ein: Schulterblaetter nach
    hinten unten fuehren, dann die Ellbogen dicht am Koerper nach hinten ziehen.'
  - Fuehre den Zug zur unteren Rippenkante oder knapp zum Bauchnabel, ohne die Schultern
    nach vorn kippen zu lassen.
  - Halte am Endpunkt kurz Spannung im oberen Ruecken, ohne ins Hohlkreuz zu fallen
    oder den Brustkorb uebertrieben herauszuschieben.
  - Lasse das Gewicht kontrolliert nach vorn zurueck, bis die Schulterblaetter sauber
    protruieren, ohne die Spannung komplett zu verlieren.
  - Waehle ein Gewicht, bei dem du den Griff mit konstantem Tempo bewegen kannst statt
    den Oberkoerper nach hinten zu reissen.
  common_errors:
  - Den Oberkoerper stark nach hinten lehnen und die Wiederholung mit Schwung statt
    mit Rueckenmuskulatur einleiten.
  - Die Schultern am Endpunkt nach oben ziehen statt die Schulterblaetter nach hinten
    unten zu kontrollieren.
  - Den Griff zu hoch zur Brust ziehen, wodurch die Ellbogen auffaechern und der Zug
    unsauber wird.
  - In der exzentrischen Phase die Spannung verlieren und die Gewichte nach vorn ziehen
    lassen.
  - Mit rundem unteren Ruecken sitzen oder aus der Lendenwirbelsaeule in Flexion und
    Extension arbeiten.
  - Zu viel Gewicht waehlen, sodass der Bewegungsumfang verkuerzt wird und die Schulterblaetter
    kaum noch arbeiten.
