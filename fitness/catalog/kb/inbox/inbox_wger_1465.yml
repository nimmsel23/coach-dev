  coaching_notes:
  - Stelle dich mit dem Rücken zum Kabelzug, greife den Griff mit neutralem Griff
    (Daumen nach oben).
  - Beuge dich leicht aus der Hüfte nach vorne, halte deinen Rücken gerade und den
    Oberkörper stabil.
  - Fixiere deinen Oberarm nah am Körper, sodass er parallel zum Boden ist und der
    Ellbogen einen 90-Grad-Winkel bildet.
  - Strecke deinen Unterarm nach hinten, indem du den Trizeps aktiv kontrahierst und
    den Ellbogen vollständig streckst.
  - Halte den Oberarm während der gesamten Bewegung absolut still und parallel zum
    Boden; nur der Unterarm bewegt sich.
  - Spüre die maximale Kontraktion im Trizeps am Ende der Bewegung und halte kurz
    inne.
  - Führe den Unterarm kontrolliert und langsam in die Ausgangsposition zurück, bis
    der Trizeps gut gedehnt ist, ohne den Oberarm nach vorne zu bewegen oder den Ellbogen
    überzustrecken.
  - Konzentriere dich auf eine flüssige, kontrollierte Bewegung und vermeide jeglichen
    Schwung.
  common_errors:
  - '**Bewegen des Oberarms:** Der häufigste Fehler ist, den Oberarm zu schwingen
    oder vom Körper wegzubewegen. Der Oberarm muss die gesamte Zeit fixiert und parallel
    zum Boden bleiben, um den Trizeps zu isolieren.'
  - '**Verwenden von Schwung:** Ein zu hohes Gewicht führt dazu, dass der Körper schwungvoll
    arbeitet, anstatt den Trizeps isoliert zu trainieren. Wähle ein Gewicht, das eine
    saubere und kontrollierte Ausführung ermöglicht.'
  - '**Unvollständiger Bewegungsumfang:** Nicht die volle Streckung des Ellbogens
    erreichen oder nicht weit genug in die Dehnung zurückgehen. Nutze den vollen Bewegungsumfang,
    um den Muskel optimal zu stimulieren.'
  - '**Rundrücken oder Hohlkreuz:** Eine schlechte Körperhaltung kann zu Verletzungen
    führen und die Stabilität beeinträchtigen. Halte den Rücken gerade und den Rumpf
    während der gesamten Übung angespannt.'
  - '**Ellbogen-Überstreckung:** Vermeide es, den Ellbogen am oberen Punkt der Bewegung
    zu überstrecken, da dies die Gelenke unnötig belasten kann. Halte eine leichte
    Spannung im Muskel.'
  original_description:
  - Greife den Griff und ziehe deinen Ellenbogen nach oben und leicht hinter deinen
    Oberkörper. Halte deinen Oberarm während des gesamten Satzes parallel zum Boden.
