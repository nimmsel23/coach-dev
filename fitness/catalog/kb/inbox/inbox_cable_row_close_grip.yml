  coaching_notes:
  - Setz dich aufrecht hin, heb das Brustbein leicht an und halte die Wirbelsaeule
    waehrend der ganzen Wiederholung neutral.
  - Zieh den Griff zur unteren Rippen- bis oberen Bauchregion, damit die Ellbogen
    eng am Koerper bleiben und die Zuglinie sauber bleibt.
  - 'Leite die Bewegung mit den Schulterblaettern ein: erst Schulterguertel stabilisieren
    und nach hinten fuehren, dann die Ellbogen nach hinten ziehen.'
  - Halte die Schultern weg von den Ohren und vermeide ein Hochziehen im oberen Trapez,
    damit der Zug im Lat und mittleren Ruecken bleibt.
  - Zieh bis zu einer klaren Endposition mit vollem Kontakt der Schulterblaetter nach
    hinten, ohne den Oberkoerper in die Wiederholung hineinzuschwingen.
  - Lass das Gewicht kontrolliert nach vorn laufen und erlaube am Ende eine saubere
    Schulterblatt-Protraktion, ohne die Lendenwirbelsaeule einzurunden.
  - Nutze einen Griff und eine Sitzposition, bei denen Unterarme und Kabel in der
    Zugphase moeglichst in einer geraden Linie bleiben.
  common_errors:
  - Den Oberkoerper nach hinten werfen, um das Gewicht mit Schwung statt mit Rueckenmuskulatur
    zu bewegen.
  - Die Ellbogen nach aussen auffaechern, wodurch aus dem engen Rudern eher eine breit
    gefuehrte Zugvariante wird.
  - Die Schultern nach oben ziehen und Spannung im Nacken aufbauen statt die Schulterblaetter
    kontrolliert nach hinten zu bewegen.
  - Nur mit den Armen ziehen und die Schulterblattbewegung fast komplett weglassen.
  - Am Endpunkt zu kurz bleiben und weder Ellbogen noch Schulterblaetter voll nach
    hinten fuehren.
  - In der Rueckfuehrung das Gewicht fallen lassen und dadurch Spannung, Position
    und Bewegungsqualitaet verlieren.
  - Mit gebeugten Handgelenken oder abgeknicktem Unterarm ziehen statt den Griff neutral
    und stabil zu fuehren.
