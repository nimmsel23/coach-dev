  coaching_notes:
  - Sitzhöhe so einstellen, dass die Griffe auf Höhe der unteren bis mittleren Brust starten.
  - Rücken und Kopf bleiben an der Lehne, Schulterblätter nach hinten und unten ziehen und dort halten.
  - Beim Drücken die Arme fast strecken, ohne die Ellbogen hart durchzudrücken; beim Zurückführen kontrolliert
    bremsen.
  common_errors:
  - Schultern wandern nach vorn oder zu den Ohren, die vordere Schulter übernimmt die Arbeit.
  - Der Rücken löst sich von der Lehne (Hohlkreuz), um Gewicht zu bewegen.
  - Das Gewicht wird mit Schwung gedrückt und fällt zurück, statt kontrolliert geführt zu werden.
