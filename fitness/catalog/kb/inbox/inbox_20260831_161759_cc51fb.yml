  coaching_notes:
  - Platziere die Hände schulterbreit mit gespreizten Fingern und presse die Handflächen
    fest in den Boden, um maximale Stabilität zu gewährleisten.
  - Schiebe den Boden aktiv von dir weg, um die Schultern zu protrahieren (nach vorne
    unten zu drücken) und die Ellbogen vollständig zu arretieren. Dies schafft eine
    stabile Basis.
  - 'Forme eine Hohlkörperposition: Spanne die Bauchmuskeln fest an, ziehe die Rippen
    nach innen und kontrahiere die Gesäßmuskulatur, um eine gerade Linie vom Kopf
    bis zu den Füßen zu bilden. Vermeide ein Hohlkreuz.'
  - Halte die Beine gestreckt und die Füße gespitzt; stelle dir vor, du versuchst,
    größer zu werden und den Himmel zu berühren.
  - Der Blick sollte zwischen die Hände oder leicht nach vorne gerichtet sein, um
    eine neutrale Nackenposition zu bewahren und die Balance zu unterstützen.
  - Achte auf eine ruhige und kontrollierte Atmung, um die Körperspannung während
    der gesamten Ausführung aufrechtzuerhalten.
  - Nutze die Finger und Handgelenke als primäre Balancekontrolle, indem du den Druck
    auf die Fingerkuppen variierst, um kleine Ausgleichsbewegungen vorzunehmen.
  common_errors:
  - Durchhängender Rücken (Bananenform) durch fehlende Rumpfspannung, was zu einer
    Überstreckung der Lendenwirbelsäule und Instabilität führt.
  - Gekrümmte Ellbogen anstatt vollständig gestreckter und arretierter Arme, was die
    Belastung auf die Gelenke erhöht und die Kraftübertragung mindert.
  - Eingefallene Schultern (nicht protrahiert), wodurch die Schulterblätter nicht
    stabilisiert sind und die Gelenke unnötig belastet werden.
  - Auseinanderfallende Beine oder angewinkelte Knie, die die Körperspannung und die
    ideale Körperlinie unterbrechen.
  - Den Kopf in den Nacken legen und den Blick nach vorne oben richten, was den Nacken
    überstreckt und die Balance negativ beeinflusst.
  - Unzureichende Spannung in den Händen und Fingern, was die feine Balancekontrolle
    erschwert und zu häufigem Fallen führt.
