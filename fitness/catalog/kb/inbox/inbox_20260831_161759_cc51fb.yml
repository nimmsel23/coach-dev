  coaching_notes:
  - Beginnen Sie in einer stabilen Ausgangsposition, z.B. von der Wand wegdrehend
    oder mit einem kontrollierten Kick-up.
  - Drücken Sie aktiv mit den Händen in den Boden, als wollten Sie den Boden wegschieben.
    Die Finger sind gespreizt und greifen leicht.
  - Halten Sie die Arme vollständig gestreckt und die Ellenbogen durchgedrückt, um
    eine stabile Basis zu gewährleisten.
  - Ziehen Sie die Schultern aktiv zu den Ohren (Schulterelevation) und drücken Sie
    die Schulterblätter nach vorne (Scapula-Protraktion), um eine stabile Schulterachse
    zu bilden.
  - 'Spannen Sie den gesamten Rumpf fest an: Bauchnabel zur Wirbelsäule ziehen, Rippen
    nach unten. Vermeiden Sie ein Hohlkreuz.'
  - Spannen Sie Gesäß und Oberschenkel aktiv an, um die Beine gestreckt und zusammenzuhalten.
    Zehen sind gespitzt.
  - Blicken Sie leicht nach vorne zwischen die Hände oder auf einen Punkt auf dem
    Boden, um die Halswirbelsäule neutral zu halten.
  - Atmen Sie ruhig und kontrolliert, versuchen Sie, die Spannung im Körper während
    des Atems beizubehalten.
  - Halten Sie eine gerade Linie von den Handgelenken bis zu den Fersen.
  common_errors:
  - '**Hohlkreuz:** Das Becken kippt nach vorne, der Rücken wird überstreckt. Dies
    führt zu Instabilität und erhöhtem Druck auf die Lendenwirbelsäule. Ursache ist
    oft mangelnde Rumpfspannung.'
  - '**Ellenbogen gebeugt:** Die Arme sind nicht vollständig durchgestreckt, was die
    Belastung auf die Ellenbogengelenke erhöht und die Effizienz des Stützdrucks verringert.'
  - '**Schultern kollabiert:** Die Schultern sind nicht aktiv hochgedrückt oder die
    Schulterblätter nicht ausreichend protrudiert, was zu einer instabilen Schulterbasis
    führt und die Nackenmuskulatur überlastet.'
  - '**Pike-Position (gebeugte Hüfte):** Die Hüfte ist zu stark gebeugt und die Beine
    sind nicht vollständig über dem Körper, wodurch die gerade Linie verloren geht
    und der Schwerpunkt verschoben wird. Mangelnde Gesäß- und Bauchspannung.'
  - '**Beine gespreizt oder gebeugt:** Die Beine sind nicht zusammen und gestreckt,
    was die Körperspannung reduziert und die Balance erschwert.'
  - '**Falscher Blick:** Der Blick ist zu weit nach vorne oder zur Seite gerichtet,
    was die Kopfposition verändert und die Balance negativ beeinflussen kann. Der
    Blick sollte zwischen die Hände oder leicht nach vorne gerichtet sein.'
  - '**Unzureichende Handposition:** Die Finger sind nicht gespreizt oder greifen
    nicht aktiv, wodurch die Basis der Unterstützung verringert wird und die Stabilisierung
    erschwert ist.'
