  coaching_notes:
  - 'Beginne aus dem Vierfüßlerstand: Lege den Scheitelpunkt deines Kopfes sanft auf
    den Boden, die Hände fassen die Ellbogen und bilden dann ein Dreieck mit den Unterarmen
    und dem Kopf.'
  - Drücke deine Unterarme und Handflächen fest in den Boden, um die Schultern zu
    aktivieren und den Druck vom Nacken zu nehmen.
  - Spann deinen Rumpf fest an, ziehe den Bauchnabel zur Wirbelsäule, um den unteren
    Rücken zu schützen und eine gerade Linie zu halten.
  - Hebe die Knie vom Boden, laufe mit den Füßen langsam näher an den Körper heran,
    bis das Becken über den Schultern ausgerichtet ist.
  - Ziehe die Knie zur Brust und strecke die Beine dann langsam und kontrolliert nach
    oben, während du die Stabilität im Rumpf beibehältst.
  - Halte die Beine aktiv gestreckt und die Füße geflext oder pointe für eine durchgehende
    Linie.
  - Atme ruhig und gleichmäßig. Konzentriere dich auf einen Punkt, um das Gleichgewicht
    zu halten.
  - Zum Abstieg beuge langsam die Knie zurück zur Brust und rolle kontrolliert nach
    unten, bis die Füße wieder auf dem Boden sind. Bleibe kurz in der Kindeshaltung,
    um den Druck aus dem Kopf zu nehmen.
  common_errors:
  - 'Einsinken in den Nacken: Der Druck sollte hauptsächlich auf den Unterarmen und
    der Krone des Kopfes liegen, nicht auf dem Nacken. Aktiviere die Schultern, indem
    du die Unterarme fest in den Boden drückst.'
  - 'Bananenrücken: Ein starkes Hohlkreuz im unteren Rücken, oft durch unzureichende
    Rumpfspannung. Halte den Rumpf fest angespannt, um den Rücken gerade zu halten
    und eine neutrale Wirbelsäule zu bewahren.'
  - 'Biegte Knie oder schlaffe Beine: Inaktive Beine erschweren das Halten des Gleichgewichts
    und reduzieren die Körperspannung. Halte die Beine aktiv gestreckt und die Muskeln
    angespannt.'
  - 'Falsche Hand- und Kopfposition: Ein zu weites oder zu enges Dreieck der Unterarme
    oder eine falsche Platzierung des Kopfes (nicht der Scheitelpunkt) kann die Stabilität
    beeinträchtigen und zu Verletzungen führen.'
  - 'Kontrollverlust beim Auf- und Abstieg: Schnelles oder ruckartiges Bewegen kann
    zu Stürzen führen. Führe alle Bewegungen langsam und bewusst aus, insbesondere
    wenn du noch unsicher bist.'
  - 'Angespannte Schultern: Die Schultern sollten von den Ohren weggezogen und aktiv
    nach unten gedrückt werden, um den Nacken zu entlasten und Stabilität im Schultergürtel
    zu gewährleisten.'
