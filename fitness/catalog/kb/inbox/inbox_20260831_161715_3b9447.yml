  coaching_notes:
  - 'Beginne mit einer festen Dreipunkt-Basis: Scheitel des Kopfes und beide Unterarme.
    Die Ellbogen sollten schulterbreit sein, die Hände fest am Boden oder ineinander
    verschränkt.'
  - Drücke die Unterarme aktiv in den Boden, um die Schultern von den Ohren wegzuschieben
    und den Nacken zu entlasten. Das meiste Gewicht sollte auf den Unterarmen, nicht
    auf dem Kopf liegen.
  - Aktiviere den Core stark, ziehe den Bauchnabel zur Wirbelsäule und schließe die
    Rippen, um ein Hohlkreuz zu vermeiden und die Wirbelsäule zu stabilisieren.
  - Hebe die Beine langsam und kontrolliert an, entweder mit angewinkelten Knien zur
    Brust oder mit gestreckten Beinen, die durch die Aktivierung der Bauchmuskeln
    nach oben gleiten.
  - Stelle sicher, dass der Nacken lang und neutral bleibt. Vermeide es, ihn zu sehr
    zu beugen oder zu strecken.
  - Halte die Beine und Füße aktiv und gestreckt, als ob du mit den Fersen und Zehen
    zur Decke schiebst, um eine gerade Linie zu schaffen.
  - Achte auf eine ruhige, gleichmäßige Atmung durch die Nase, um die Stabilität des
    Rumpfes aufrechtzuerhalten.
  - Übe den Kopfstand zuerst an einer Wand oder mit einem Spotter, um Sicherheit und
    Vertrauen aufzubauen.
  common_errors:
  - Zu viel Gewicht auf dem Kopf und Nacken, wodurch der Nacken überlastet wird und
    das Verletzungsrisiko steigt.
  - Kollabierende Schultern, die nicht aktiv nach oben drücken und somit den Nacken
    nicht entlasten.
  - Ein Hohlkreuz oder Rundrücken im Rumpf aufgrund unzureichender Core-Aktivierung,
    was die Wirbelsäule belastet.
  - Ausrutschende Ellbogen, die breiter als schulterbreit werden und die Basis instabil
    machen.
  - Unkontrolliertes oder schnelles Hochschwingen der Beine, was zu einem Verlust
    der Balance führen kann.
  - Festhalten des Atems, wodurch der Rumpf angespannt wird und die Stabilität beeinträchtigt
    wird.
  - Fehlende Rumpf- und Schulterkraft als Voraussetzung, was die Übung unsicher macht.
