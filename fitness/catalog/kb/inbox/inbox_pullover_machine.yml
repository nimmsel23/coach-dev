  coaching_notes:
  - Richte die Maschine so ein, dass sich das Schultergelenk sauber mit der Drehachse
    der Maschine deckt; nur dann bleibt die Belastung auf Lat und Teres major statt
    unnötig auf der Schultervorderseite.
  - Halte den Brustkorb stolz, die Rippen aber unten, und spanne den Bauch an, damit
    die Bewegung aus dem Schultergelenk kommt und nicht aus einem Hohlkreuz.
  - Beginne aus einer langen Position mit leicht gebeugten, konstant fixierten Ellbogen;
    der Ellenbogenwinkel bleibt während des Satzes nahezu unverändert.
  - Ziehe die Arme in einem kontrollierten Bogen nach unten, indem du die Oberarme
    Richtung Hüfte führst und die Achseln aktiv schließt.
  - Denke an Schulterblätter nach unten und stabil, statt die Schultern nach vorn
    hochzuziehen; so bleibt der Latissimus in einer besseren Arbeitslinie.
  - Arbeite mit voller, schmerzfreier Dehnung oben und beende die konzentrische Phase
    mit bewusster Lat-Spannung unten, ohne die Bewegung mit den Händen zu dominieren.
  - Wähle ein Gewicht, bei dem du die exzentrische Phase sauber bremsen kannst; gerade
    bei der Dehnposition bringt die kontrollierte Rückführung den größten Trainingsreiz.
  common_errors:
  - Die Bewegung durch Ellbogenbeugung in eine Art Trizeps- oder Rudervariante verwandeln,
    statt den Oberarm aus dem Schultergelenk zu führen.
  - Mit einem Hohlkreuz oder aufklappendem Brustkorb arbeiten, um das Gewicht zu bewegen;
    dadurch sinkt die Zielmuskelspannung und die Lendenwirbelsäule übernimmt.
  - Die Schultern nach oben ziehen oder nach vorn einrollen lassen, wodurch die Last
    aus dem Latissimus in Nacken und vordere Schulter verlagert wird.
  - Zu tief oder zu aggressiv in die obere Dehnposition gehen, obwohl die Schulterbeweglichkeit
    das nicht sauber zulässt.
  - Am unteren Ende nur das Gewicht anschlagen oder ablegen, statt aktiv in die Endkontraktion
    zu ziehen.
  - Zu viel Gewicht wählen und die konzentrische Phase mit Schwung einleiten, wodurch
    die Maschine zwar bewegt wird, die Zielmuskulatur aber schlechter arbeitet.
  - Den Bewegungsradius künstlich verkürzen und die starke Dehnung oben vermeiden,
    obwohl genau dort ein wesentlicher Teil des Trainingsreizes entsteht.
