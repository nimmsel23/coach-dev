  coaching_notes:
  - Stange auf dem oberen Rücken ablegen (hinter dem Nacken, nicht auf den Halswirbeln), Ellbogen zeigen
    nach unten, Brust bleibt offen.
  - Vor dem Abwärtsgehen tief einatmen und den Rumpf fest machen; die Spannung bleibt über den ganzen
    Satz.
  - Knie und Hüfte beugen gleichzeitig, die Knie laufen in Richtung der Fußspitzen, die Fußsohle bleibt
    voll am Boden.
  - Nur so tief gehen, wie der Rücken neutral bleibt; aus der tiefsten Position drückst du dich durch
    die ganze Fußsohle nach oben.
  common_errors:
  - Knie fallen nach innen, wenn es anstrengend wird.
  - Der untere Rücken rundet sich am Boden der Bewegung (Butt Wink).
  - Oberkörper kippt nach vorn, weil die Hüfte schneller hochkommt als die Schultern.
  - Fersen heben ab, weil das Gewicht auf die Zehen wandert.
