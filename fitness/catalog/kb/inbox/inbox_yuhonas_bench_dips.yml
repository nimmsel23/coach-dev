  coaching_notes:
  - Platziere eine Bank hinter dir in Schulterhöhe. Greife die Vorderkante der Bank
    mit schulterbreitem Griff, Handflächen zeigen nach unten. Strecke die Arme vollständig
    aus und deine Füße sind auf dem Boden oder auf einer zweiten Bank für mehr Widerstand.
  - Senke deinen Körper kontrolliert ab, indem du die Ellenbogen beugst. Die Ellenbogen
    sollten nah am Körper bleiben und nach hinten zeigen, nicht nach außen. Gehe so
    tief, dass deine Ellenbogen einen Winkel von etwa 90 Grad erreichen oder leicht
    darunter.
  - Achte darauf, dass die Schultern nicht nach oben zum Ohr hochgezogen werden. Halte
    die Schulterblattstabilität während der gesamten Bewegung aufrecht.
  - Drücke durch die Kraft deiner Trizepse und deine Brustmuskulatur, um dich wieder
    in die Ausgangsposition zu bringen. Strecke die Arme fast vollständig aus, halte
    aber eine leichte Flexion in den Ellenbogen um die Spannung zu bewahren.
  - Atme während der exzentrischen Phase (Absenken) ein und während der konzentrischen
    Phase (Hochdrücken) aus. Führe die Bewegung immer kontrolliert durch, nicht explosiv.
  - 'Für eine erhöhte Brustbetonung: Lehne deinen Oberkörper leicht nach vorne und
    positioniere deine Füße näher unter dir. Für maximale Trizepsbetonung: Halte deinen
    Oberkörper aufrecht und deine Ellenbogen dicht am Körper.'
  - Anfänger können mit den Füßen auf dem Boden beginnen oder ein Bein anheben. Fortgeschrittene
    können beide Beine auf einer Bank ablegen oder Gewicht auf dem Schoß balancieren.
  common_errors:
  - 'Ellenbogen zu weit nach außen spreizen: Dies reduziert die Trizepsaktivierung
    und belastet die Schulter unangemessen. Halte die Ellenbogen immer eng am Körper.'
  - 'Zu flache Bewegungsamplitude: Viele führen nur eine halbe Bewegung aus. Gehe
    so tief wie möglich (bis etwa 90 Grad Ellenbogenwinkel) um maximale Muskelaktivierung
    zu erreichen.'
  - 'Schultern nach oben hochziehen während der Bewegung: Dies deutet auf unzureichende
    Scapula-Stabilität hin. Halte die Schultern bewusst entspannt und senk sie ab.'
  - 'Explosive oder ruckartige Bewegungen: Dies erhöht das Verletzungsrisiko und reduziert
    die Effektivität. Führe die Bewegung langsam und kontrolliert aus, mit 2-3 Sekunden
    für beide Phasen.'
  - 'Hände zu weit auseinander platzieren: Ein zu breiter Griff macht die Übung weniger
    effektiv. Verwende Schulterbr breite oder leicht schmalere Griffweite.'
  - 'Den Kopf nach unten oder hinten neigen: Dies kann zu Nackenverspannungen führen.
    Blicke nach vorne und halte den Nacken neutral während der gesamten Bewegung.'
  - 'Die Arme vollständig lockern oben: Dies nimmt die Spannung aus den Muskeln. Halte
    eine leichte Flexion in den Ellenbogen beibehalt, ohne sie ganz durchzustrecken.'
  - 'Hüften zu nah an der Bank: Dies reduziert die Bewegungsamplitude. Positioniere
    deine Hüften mindestens eine Fußlänge von der Bank weg.'
  - 'Keine Atemkontrolle: Unkontrolliertes Atmen reduziert Stabilität und Kraft. Synchronisiere
    immer deine Atmung mit der Bewegung: einatmen beim Absenken, ausatmen beim Hochdrücken.'
