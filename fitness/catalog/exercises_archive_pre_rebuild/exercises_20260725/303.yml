  variations:
  - cable_rear_delt_fly
  coaching_notes:
  - Hintere Schulter aktiv isolieren, indem die Schulterblätter nicht zu stark zusammengezogen
    werden (Fokus auf Deltoid).
  - Bewegung klein, präzise und kontrolliert ausführen.
  - Oberkörper stabil und parallel zum Boden (vorgebeugt).
  common_errors:
  - Zu viel Schwung aus dem Oberkörper.
  - Den oberen Trapez die Arbeit übernehmen lassen durch Hochziehen der Schultern.
