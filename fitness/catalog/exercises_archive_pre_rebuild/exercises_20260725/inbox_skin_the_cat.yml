  coaching_notes:
  - Beginne im aktiven Hang an einer Stange oder Ringen, die Schultern sind von den
    Ohren weggezogen.
  - Hebe die Beine an und führe sie kontrolliert zwischen den Armen und dem Oberkörper
    hindurch nach hinten und oben.
  - Halte während der gesamten Bewegung eine starke Rumpfspannung aufrecht, um den
    Körper zu stabilisieren.
  - Kontrolliere die Abwärtsbewegung in die tiefste Position (German Hang oder maximale
    Schultermobilität), um die Schultergelenke zu schützen und die Kraft zu nutzen.
  - Die Bewegung sollte flüssig und ohne Schwung ausgeführt werden, primär durch Kraft
    und Kontrolle.
  common_errors:
  - Unkontrolliertes Schwingen oder schnelles Fallenlassen in die untere Position,
    was die Schultergelenke überlasten kann.
  - Passives Hängen in den Schultern ohne aktive Anspannung, besonders in der unteren
    Position.
  - Verlust der Rumpfspannung, was zu einer Überstreckung der Lendenwirbelsäule führen
    kann.
  - Zu schnelle Progression ohne ausreichende Schulterkraft und -mobilität.
