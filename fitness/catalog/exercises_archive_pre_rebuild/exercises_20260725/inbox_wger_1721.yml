  coaching_notes: '1.  **Startposition:** Stellen Sie sich seitlich zum Kabelzuggerät
    auf. Die Rolle sollte sich auf Schulterhöhe befinden. Fassen Sie den Griff mit
    der gegenüberliegenden Hand (z.B. rechte Hand greift linkes Kabel), sodass das
    Kabel Ihren Körper kreuzt. Halten Sie den Rumpf aufrecht, die Knie leicht gebeugt
    und den Arm leicht angewinkelt vor dem Körper, wobei der Ellenbogen auf etwa 10-20
    Grad gebeugt ist.

    2.  **Ausführung:** Initiieren Sie die Bewegung aus der hinteren Schultermuskulatur,
    indem Sie das Kabel mit der arbeitenden Hand kontrolliert nach hinten außen ziehen.
    Ziel ist es, den Arm in etwa eine Linie mit der Schulter zu bringen. Konzentrieren
    Sie sich darauf, die Schulterblätter aktiv, aber nur minimal, zusammenzuziehen,
    um die Isolation des hinteren Deltamuskels zu maximieren. Halten Sie den Rumpf
    während der gesamten Bewegung stabil und vermeiden Sie jegliche Rotation oder
    Neigung.

    3.  **Endposition:** Halten Sie die Spitzenkontraktion für einen kurzen Moment,
    um die Zielmuskulatur maximal zu aktivieren. Führen Sie das Kabel dann langsam
    und kontrolliert in die Ausgangsposition zurück, widerstehen Sie dem Zug des Kabels,
    um die exzentrische Phase voll auszunutzen und die Spannung auf der hinteren Schulter
    zu halten.

    4.  **Atmung:** Atmen Sie beim Ziehen des Kabels aus (konzentrische Phase) und
    beim kontrollierten Zurückführen des Arms ein (exzentrische Phase).

    5.  **Fokus auf Mind-Muscle Connection:** Priorisieren Sie stets die bewusste
    Ansteuerung des hinteren Deltamuskels gegenüber der Last. Die Bewegung sollte
    fließend und ohne Schwung ausgeführt werden.'
  common_errors: '1.  **Mangelnde Isolation durch zu viel Gewicht:** Der häufigste
    Fehler ist die Wahl eines zu hohen Gewichts, was dazu führt, dass der Oberkörper
    rotiert, Schwung eingesetzt wird oder andere, stärkere Muskeln (wie der Latissimus
    oder die oberen Trapezmuskeln) die Hauptarbeit übernehmen. Reduzieren Sie das
    Gewicht und konzentrieren Sie sich auf eine saubere, kontrollierte Form.

    2.  **Veränderung des Ellenbogenwinkels:** Ein starkes Beugen oder Strecken des
    Ellenbogens während der Bewegung verlagert die Belastung unnötig auf den Bizeps
    oder Trizeps und mindert die Effektivität für die hintere Schulter. Der leichte
    Winkel im Ellenbogen sollte während der gesamten Ausführung konstant bleiben.

    3.  **Schultern hochziehen (Shrugging):** Das Hochziehen der Schultern deutet
    auf eine Überaktivität der oberen Trapezmuskeln hin. Halten Sie die Schultern
    bewusst tief und entspannt, um den Fokus auf die hinteren Deltamuskeln zu legen
    und Nackenspannungen zu vermeiden.

    4.  **Fehlende Rumpfstabilisierung:** Da es sich um eine unilaterale Übung handelt,
    ist eine robuste Rumpfspannung von entscheidender Bedeutung, um eine Rotation
    des Oberkörpers zu verhindern. Ein instabiler Rumpf führt zu Kompensationsbewegungen
    und kann das Verletzungsrisiko erhöhen. Aktivieren Sie aktiv Ihre Bauch- und Rückenmuskulatur.

    5.  **Verwendung von Schwung und fehlende Exzentrik:** Ein schnelles, ruckartiges
    Ziehen und ein unkontrolliertes Ablassen des Gewichts reduziert die Time Under
    Tension und damit die Effektivität der Übung. Die exzentrische Phase ist entscheidend
    für den Muskelaufbau; führen Sie die Bewegung daher in beide Richtungen langsam
    und kontrolliert aus.'
