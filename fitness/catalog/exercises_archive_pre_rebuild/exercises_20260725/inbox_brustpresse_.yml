  primary_muscles:
  - 101_pectoralis_major
  secondary_muscles:
  - 301_anterior_deltoid
  - 403_triceps_brachii
  coaching_notes:
  - Stellen Sie die Sitzhöhe so ein, dass die Griffe auf Höhe der mittleren Brust
    liegen und die Schultern nicht hochgezogen werden.
  - Halten Sie die Schultern während der gesamten Bewegung stabil, nach hinten und
    unten gezogen (Schulterretraktion und -depression).
  - Drücken Sie die Griffe kontrolliert nach vorne, ohne die Ellbogen vollständig
    zu arretieren.
  - Führen Sie die Bewegung langsam und kontrolliert zurück in die Ausgangsposition,
    um die Muskulatur unter Spannung zu halten.
  - Atmen Sie beim Drücken aus und beim Zurückführen der Griffe ein.
  common_errors:
  - Die Schultern nach vorne rollen lassen (Schulterprotraktion), was die Schultergesundheit
    beeinträchtigen kann.
  - Die Ellbogen zu weit nach außen spreizen, was die Schultergelenke übermäßig belastet.
  - Die Bewegung zu schnell und unkontrolliert ausführen, insbesondere das 'Abfedern'
    des Gewichts.
  - Die Ellbogen am höchsten Punkt der Bewegung vollständig durchstrecken und arretieren,
    was die Gelenke belastet anstatt die Muskulatur.
