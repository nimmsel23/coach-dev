  coaching_notes:
  - Beginnen Sie mit der Langhantel auf dem Boden, die Füße hüftbreit auseinander
    und die Hände etwas breiter als schulterbreit am Griff.
  - '**Umsetzen (Clean):** Heben Sie die Hantel explosiv vom Boden ab, nutzen Sie
    dabei die Kraft aus Beinen und Hüfte. Ziehen Sie die Hantel nah am Körper hoch,
    machen Sie eine Schulterzuckbewegung (Shrug) und fangen Sie die Hantel in der
    Front-Rack-Position ab (Ellbogen hoch, Hantel ruht auf Schultern/Brustkorb). Gehen
    Sie dabei leicht in die Knie, um den Aufprall abzufedern.'
  - '**Drücken (Press):** Aus der Front-Rack-Position drücken Sie die Hantel vertikal
    über den Kopf, bis die Arme vollständig gestreckt sind. Halten Sie dabei den Rumpf
    fest und vermeiden Sie den Einsatz der Beine (kein Push-Press).'
  - Kontrollieren Sie die Bewegung beim Ablassen der Hantel zurück in die Front-Rack-Position
    und anschließend zum Boden oder in die nächste Wiederholung.
  - Achten Sie auf eine stabile Körperhaltung und einen geraden Rücken während der
    gesamten Übung.
  common_errors:
  - Rundrücken beim Heben der Hantel vom Boden (Clean-Phase).
  - Unzureichende Hüftextension und Beinarbeit beim Clean, was zu einem reinen Armzug
    führt.
  - Die Hantel beim Umsetzen zu weit vom Körper wegbewegen.
  - Den Oberkörper beim Überkopfdrücken nach hinten lehnen oder die Hantel nach vorne
    drücken statt vertikal.
  - Verwendung von Beinunterstützung beim Drücken (Verwechslung mit Push Press).
