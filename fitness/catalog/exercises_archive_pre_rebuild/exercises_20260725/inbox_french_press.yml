  coaching_notes:
  - Halte die Ellenbogen während der gesamten Bewegung eng und fixiert.
  - Führe die Bewegung kontrolliert und langsam aus, besonders in der Abwärtsphase
    (exzentrisch).
  - Senke die Hantel(n) bewusst in Richtung Stirn oder leicht dahinter, um eine maximale
    Dehnung im Trizeps zu erreichen.
  - Spanne den Rumpf an, um ein Hohlkreuz zu vermeiden und Stabilität zu gewährleisten.
  common_errors:
  - Ausgestellte oder seitlich wegbewegende Ellenbogen, die die Belastung vom Trizeps
    nehmen.
  - Zu hohes Gewicht, das zu unkontrollierten Bewegungen und fehlender Technik führt.
  - Schwung holen oder die Hantel(n) am unteren Punkt abprallen lassen.
  - Ein übermäßiges Hohlkreuz, das den unteren Rücken unnötig belastet.
