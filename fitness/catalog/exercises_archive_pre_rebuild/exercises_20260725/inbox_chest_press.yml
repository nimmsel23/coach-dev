  coaching_notes:
  - Lege dich auf eine Flachbank oder setze dich an die entsprechende Maschine. Achte
    auf einen stabilen Stand der Füße auf dem Boden.
  - Fasse die Griffe oder die Stange etwas breiter als schulterbreit, mit den Handgelenken
    in einer neutralen Position.
  - Senke das Gewicht kontrolliert ab, bis deine Ellbogen leicht unterhalb der Bank
    sind oder bis zur Mitte der Brust bei einer Stange.
  - Drücke das Gewicht aus der Brust explosiv nach oben, ohne die Ellbogen vollständig
    durchzustrecken, um die Spannung in den Muskeln zu halten.
  - Halte während der gesamten Bewegung die Schultern nach hinten unten gezogen und
    stabil, um die Brustmuskulatur optimal zu isolieren.
  common_errors:
  - Eine zu große Brücke im unteren Rücken, welche die Lendenwirbelsäule unnötig belastet.
  - Ellbogen zu weit abgespreizt oder zu eng am Körper, was die Schultergelenke belasten
    kann.
  - Das Gewicht zu schnell absinken lassen, wodurch die Kontrolle verloren geht und
    das Verletzungsrisiko steigt.
  - Die Schultern heben sich von der Bank oder drehen sich nach vorne, was die Schultermuskulatur
    überlastet.
  - Nicht vollständige Bewegungsamplitude (ROM), wodurch der Muskel nicht vollständig
    trainiert wird.
