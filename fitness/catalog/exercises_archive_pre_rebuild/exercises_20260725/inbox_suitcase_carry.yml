  id: suitcase_carry
  name: Suitcase Carry
  display_name: Einarmiger Koffer-Gang
  german: Einarmiger Koffer-Gang
  category: core
  type: compound
  movement_pattern: loaded_carry
  equipment:
  - dumbbell
  - kettlebell
  primary_muscles:
  - 502_obliquus_externus
  - 505_quadratus_lumborum
  - 206_erector_spinae
  secondary_muscles:
  - 405_forearm_flexors
  - 202_trapezius
  - 602_gluteus_medius
  - 501_rectus_abdominis
  coaching_notes:
  - Halte den Oberkörper während der gesamten Bewegung aufrecht und stabil. Widerstehe
    dem Drang, zur Seite des Gewichts zu kippen oder die Schulter hängen zu lassen.
  - Gehe kontrolliert und aufrecht. Spanne deine Rumpfmuskulatur aktiv an, um die
    Stabilität zu gewährleisten und unnötiges Schwingen zu vermeiden.
  common_errors:
  - Ein seitliches Neigen des Oberkörpers zur Seite des Gewichts, was die beabsichtigte
    Rumpfstabilisierung reduziert und die Effektivität mindert.
  - Eine passive Schulterhaltung des tragenden Arms, bei der die Schulter absinkt
    oder nach vorne rollt, anstatt aktiv durch die oberen Rückenmuskeln stabilisiert
    zu werden.
