  name: Body Rows
  display_name: Körpergewichtsrudern
  german: Körpergewichtsrudern
  category: back
  type: compound
  movement_pattern: horizontal_pull
  equipment:
  - bodyweight
  - suspension_trainer
  - bar
  primary_muscles:
  - 201_latissimus_dorsi
  - 205_rhomboids
  - 203_trapezius_middle
  secondary_muscles:
  - 401_biceps_brachii
  - 303_posterior_deltoid
  - 404_brachioradialis
  - 500_core
  coaching_notes:
  - Halten Sie den gesamten Körper, insbesondere den Rumpf, während der gesamten Bewegung
    angespannt, um ein Durchhängen der Hüften zu vermeiden.
  - Ziehen Sie die Schulterblätter bewusst zusammen und nach hinten, während Sie die
    Ellbogen eng am Körper halten.
  - Führen Sie die Bewegung kontrolliert aus, sowohl beim Hochziehen als auch beim
    langsamen und kontrollierten Ablassen.
  - Halten Sie den Kopf in einer neutralen Position, in Verlängerung der Wirbelsäule.
  common_errors:
  - Durchhängen des unteren Rückens oder der Hüften, was die Rumpfspannung verringert
    und unnötigen Stress auf die Wirbelsäule ausübt.
  - Nicht vollständige Bewegungsausführung, d.h. nicht ganz hochziehen oder nicht
    ganz absenken, wodurch das volle Potenzial der Übung nicht ausgeschöpft wird.
  - Einsatz von Schwung oder Rucken, anstatt die Bewegung kontrolliert aus den Zielmuskeln
    zu steuern.
  - Hochziehen der Schultern zu den Ohren anstatt der Retraktion und Depression der
    Schulterblätter.
