  coaching_notes:
  - Halten Sie die Ellenbogen leicht angewinkelt, um die Schultern zu schonen.
  - Führen Sie die Bewegung kontrolliert und fließend aus, sowohl beim Hochdrücken
    als auch beim Ablassen des Gewichts.
  - Konzentrieren Sie sich darauf, die Brustmuskulatur aktiv zu kontrahieren.
  - Vermeiden Sie es, die Schultern hochzuziehen; halten Sie sie während der gesamten
    Bewegung stabil und nach hinten unten gezogen.
  - Atmen Sie beim Hochdrücken aus und beim Ablassen ein.
  common_errors:
  - Zu hohes Gewicht, wodurch die Form leidet und andere Muskeln übermäßig eingesetzt
    werden.
  - Vollständiges Durchstrecken der Ellenbogen am oberen Punkt, was die Gelenke unnötig
    belastet.
  - Zu schnelles Ablassen des Gewichts ohne Kontrolle.
  - Hochziehen der Schultern zur Ohren, was zu Nackenverspannungen führen kann.
  - Zu starkes Hohlkreuz, besonders bei Langhantel- oder Kurzhantelvarianten.
