  coaching_notes:
  - Stellen Sie die Schrägbank auf einen Winkel von 30-45 Grad ein (Clavicular-Fokus).
  - Kontrollierte Exzentrik (2-3 Sek. ablassen).
  - Hanteln in einer leicht bogenförmigen Bewegung nach oben führen.
  - Brustkorb stolz halten (Scapula-Retraktion).
  common_errors:
  - Zu hoher Bankwinkel (>45 Grad) verlagert Last auf vordere Schulter.
  - Ellenbogen am obersten Punkt vollständig durchstrecken (Spannungsverlust).
  - Unkontrolliertes "Fallenlassen" der Gewichte.
