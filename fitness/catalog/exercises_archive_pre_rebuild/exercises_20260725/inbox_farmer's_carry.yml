  coaching_notes:
  - Halten Sie eine aufrechte, stolze Haltung bei. Die Schultern sind zurück und unten,
    die Brust ist herausgestreckt.
  - Spannen Sie den Rumpf fest an, um eine neutrale Wirbelsäule zu bewahren und seitliches
    Kippen des Oberkörpers zu verhindern (Anti-Lateral-Flexion).
  - Wählen Sie ein Gewicht, das herausfordernd ist, aber eine gute Form über die gesamte
    Distanz ermöglicht. Der Griff sollte idealerweise das erste sein, was nachlässt.
  - Machen Sie kleine, kontrollierte Schritte. Vermeiden Sie ein Humpeln oder ein
    zu schnelles Tempo.
  common_errors:
  - Rundrücken oder nach vorne gebeugte Schultern, die die Wirbelsäule unnötig belasten
    und die Effektivität mindern.
  - Deutliches seitliches Neigen des Oberkörpers zu einer Seite, um das Gewicht zu
    kompensieren, anstatt den Rumpf zu stabilisieren.
  - Herunterhängende oder nicht fixierte Schultern, die die Trapezmuskulatur überlasten
    und die Stabilität der Last reduzieren.
  - Unkontrolliertes oder schlurfendes Gehen, das das Risiko von Stolpern erhöht und
    die biomechanische Effizienz verringert.
