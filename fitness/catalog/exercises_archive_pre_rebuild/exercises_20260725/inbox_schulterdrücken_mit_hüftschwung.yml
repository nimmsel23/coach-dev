  coaching_notes:
  - '**Ausgangsposition:** Beginne mit dem Gewicht (Langhantel oder Kurzhanteln) auf
    den Schultern, Füße schulterbreit auseinander, Knie leicht gebeugt und der Rumpf
    angespannt. Die Ellenbogen zeigen leicht nach vorne unten, um die Hantel sicher
    zu halten.'
  - '**Der Dip (Vorbereitung):** Leite die Bewegung ein, indem du die Knie und Hüften
    leicht und kontrolliert beugst (ein ''Viertel-Kniebeuge''). Dieser Dip sollte
    kurz, schnell und nicht zu tief sein, um Spannung aufzubauen.'
  - '**Der Drive (Explosive Kraftentfaltung):** Explodiere sofort und kraftvoll aus
    den Beinen und der Hüfte, indem du diese schnell streckst. Nutze diesen Impuls,
    um das Gewicht nach oben zu beschleunigen.'
  - '**Der Press (Überkopfdrücken):** Sobald der Hüftschwung dem Gewicht ausreichend
    Schwung verliehen hat, drücke die Hantel mit den Schultern und Armen vollständig
    über den Kopf, bis die Arme gestreckt und das Gewicht stabil über dem Mittelpunkt
    des Körpers positioniert ist.'
  - '**Kontrolliertes Absenken:** Lasse das Gewicht nach der vollständigen Streckung
    kontrolliert und mit gespanntem Rumpf wieder auf die Schultern absinken, um die
    nächste Wiederholung vorzubereiten oder die Übung zu beenden. Nutze die Beine
    leicht zur Abfederung.'
  - '**Atmung:** Atme während des explosiven ''Drive'' und ''Press'' kräftig aus.
    Atme beim Absenken des Gewichts ein.'
  common_errors:
  - '**Zu tiefer Dip:** Ein zu tiefer Dip verlangsamt die Bewegung und nimmt die Explosivität,
    wodurch die Beinkraft weniger effektiv genutzt wird.'
  - '**Fehlende Hüftextension:** Eine unzureichende oder schwache Streckung der Hüfte
    führt dazu, dass der entscheidende Impuls aus den Beinen fehlt und die Schultern
    die Hauptlast allein tragen müssen.'
  - '**Übermäßiges Hohlkreuz:** Ein starkes Durchbiegen des unteren Rückens während
    des Drückens oder in der Endposition deutet auf eine schwache Rumpfspannung hin
    und erhöht das Verletzungsrisiko.'
  - '**Gewicht zu weit vorne/hinten:** Die Hantel sollte in einer möglichst geraden
    Linie vertikal über den Kopf bewegt werden. Ein zu starkes Ausweichen nach vorne
    oder hinten verlagert den Schwerpunkt und erhöht die Instabilität.'
  - '**Unkontrolliertes Absenken:** Das Gewicht einfach fallen zu lassen oder unkontrolliert
    auf die Schultern prallen zu lassen, kann zu Verletzungen führen und die Stabilität
    des Rumpfes beeinträchtigen.'
