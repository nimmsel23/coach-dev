  coaching_notes: 'Die T/Y/I-Armhebeübungen sind hervorragend geeignet, um die Haltung
    zu verbessern und die Rückenschultermuskulatur zu stärken, die oft bei sitzender
    Tätigkeit vernachlässigt wird.


    **Ausführungshinweise:**

    1.  **Startposition:** Liegen Sie mit dem Gesicht nach unten auf einer stabilen
    Unterlage (z.B. einer Bank, einem Gymnastikball) oder stehen Sie vorgebeugt mit
    geradem Rücken und leicht gebeugten Knien. Halten Sie Ihren Nacken in einer neutralen
    Position, in Verlängerung der Wirbelsäule.

    2.  **Bewegung (T-Raise):** Heben Sie die Arme seitlich an, sodass Ihr Körper
    und Ihre Arme ein ''T'' bilden. Die Daumen zeigen nach oben. Konzentrieren Sie
    sich darauf, die Schulterblätter aktiv nach hinten und unten zu ziehen.

    3.  **Bewegung (Y-Raise):** Heben Sie die Arme in einem Winkel von etwa 45 Grad
    nach vorne-oben an, sodass Ihr Körper und Ihre Arme ein ''Y'' bilden. Die Daumen
    zeigen nach oben. Auch hier aktiv die Schulterblätter nach hinten-unten bewegen
    und leicht nach oben rotieren.

    4.  **Bewegung (I-Raise):** Heben Sie die Arme direkt nach hinten an, parallel
    zum Körper, sodass Ihr Körper und Ihre Arme ein ''I'' bilden. Die Daumen zeigen
    nach oben. Fokus liegt auf der Streckung der Schulter und dem aktiven Zurückziehen
    und Deprimieren der Schulterblätter.

    5.  **Kontrolle:** Führen Sie die Bewegung langsam und kontrolliert aus, sowohl
    beim Anheben als auch beim Absenken. Spüren Sie die Kontraktion in den hinteren
    Schultern und im oberen Rücken. Vermeiden Sie Schwung.

    6.  **Atmung:** Atmen Sie beim Anheben der Arme aus und beim kontrollierten Absenken
    ein.

    7.  **Gewicht:** Beginnen Sie gegebenenfalls mit dem eigenen Körpergewicht oder
    sehr leichten Kurzhanteln/Widerstandsbändern. Die Qualität der Bewegung ist hier
    wichtiger als das Gewicht.'
  common_errors: "**1. Hochziehen der Schultern (Shrugging):**\n   *   **Fehler:**\
    \ Die oberen Trapezius-Muskeln werden übermäßig aktiviert, indem die Schultern\
    \ zu den Ohren gezogen werden. Dies kann zu Nackenverspannungen führen.\n   *\
    \   **Korrektur:** Konzentrieren Sie sich darauf, die Schulterblätter aktiv nach\
    \ hinten *und unten* zu ziehen, um primär die mittleren und unteren Anteile des\
    \ Trapezius zu aktivieren und den Nacken zu entlasten.\n\n**2. Hohlkreuzbildung\
    \ (Hyperextension der Lendenwirbelsäule):**\n   *   **Fehler:** Besonders in der\
    \ vorgebeugten Position oder auf dem Bauch kann es zu einem starken Hohlkreuz\
    \ kommen, wenn die Rumpfmuskulatur nicht stabilisiert wird.\n   *   **Korrektur:**\
    \ Spannen Sie die Bauchmuskulatur aktiv an (Bauchnabel leicht zur Wirbelsäule\
    \ ziehen), um den Rumpf zu stabilisieren und die Lendenwirbelsäule in einer neutralen\
    \ Position zu halten.\n\n**3. Einsatz von Schwung statt Muskelkraft:**\n   * \
    \  **Fehler:** Die Arme werden mit Schwung angehoben, anstatt die Muskeln des\
    \ oberen Rückens und der hinteren Schultern gezielt einzusetzen.\n   *   **Korrektur:**\
    \ Wählen Sie ein Gewicht, das eine langsame, kontrollierte Bewegung über den gesamten\
    \ Bewegungsumfang ermöglicht. Der Fokus liegt auf der Muskelkontraktion, nicht\
    \ auf der Höhe des Anhebens.\n\n**4. Überstreckung des Nackens (Forward Head Posture):**\n\
    \   *   **Fehler:** Der Kopf wird während der Übung nach vorne gestreckt oder\
    \ in den Nacken gelegt, um die Arme höher zu bekommen.\n   *   **Korrektur:**\
    \ Halten Sie den Kopf in einer neutralen Position, in direkter Verlängerung der\
    \ Wirbelsäule. Stellen Sie sich vor, Sie halten einen Tennisball unter Ihrem Kinn.\n\
    \n**5. Zu hohes Gewicht:**\n   *   **Fehler:** Das gewählte Gewicht ist zu schwer,\
    \ was zu Kompensationen, schlechter Form und einer geringeren Aktivierung der\
    \ Zielmuskulatur führt.\n   *   **Korrektur:** Starten Sie mit dem eigenen Körpergewicht\
    \ oder sehr leichten Gewichten. Die Übung ist primär für die Haltungsmuskulatur\
    \ konzipiert, die besser auf geringe Lasten und hohe Wiederholungszahlen anspricht."
