  coaching_notes:
  - Führen Sie die Bewegung langsam und kontrolliert aus, indem Sie die Wirbelsäule
    segment für Segment beugen und strecken (Roll-down und Roll-up Technik).
  - Halten Sie die Beine während der gesamten Übung gestreckt, um eine maximale Dehnung
    der hinteren Oberschenkelmuskulatur zu erzielen.
  - Beginnen Sie mit einem sehr leichten Gewicht oder nur mit dem Körpergewicht, um
    die Wirbelsäulenmobilität zu verbessern und die Kontrolle zu erlernen.
  - Stellen Sie sich für einen größeren Bewegungsumfang auf eine erhöhte Plattform,
    z.B. eine Stufe.
  common_errors:
  - Die Bewegung zu schnell ausführen und die segmentale Kontrolle verlieren, was
    das Verletzungsrisiko für die Wirbelsäule erhöht.
  - Die Knie während der Abwärtsbewegung beugen, was die Dehnung der hinteren Oberschenkelmuskulatur
    reduziert und den Trainingseffekt mindert.
  - Zu viel Gewicht verwenden, bevor die erforderliche Mobilität und Rumpfkontrolle
    entwickelt wurde.
