[project]
name = "fuel-tracker"
version = "0.1.0"
description = "A simple macro tracking journal using Gemini NLP"
authors = [
    {name = "Alpha",email = "alpha@alphaos.local"}
]
requires-python = ">=3.14"
dependencies = [
    "alembic (>=1.18.5,<2.0.0)",
    "python-dotenv (>=1.2.2,<2.0.0)",
    "psycopg2-binary (>=2.9.12,<3.0.0)",
    "sqlalchemy (>=2.0.51,<3.0.0)",
    "pydantic (>=2.13.4,<3.0.0)",
    "google-genai (>=2.10.0,<3.0.0)",
    "fastapi (>=0.139.0,<0.140.0)",
    "httpx (>=0.27.0,<1.0.0)",
    "uvicorn[standard] (>=0.51.0,<0.52.0)"
]


[tool.poetry]
packages = [{ include = "fuel", from = ".." }]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
