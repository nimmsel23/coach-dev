  coaching_notes:
  - Der weite Untergriff-Klimmzug ist eine hervorragende Übung für den oberen Rücken
    und die Arme, insbesondere den Bizeps.
  - 'Greifen Sie die Stange im Untergriff (Handflächen zeigen zum Körper) deutlich
    breiter als schulterbreit — das unterscheidet ihn vom normalen Chin-Up: mehr Latissimus
    über Schulteradduktion, weniger Bizeps-Dominanz.'
  - Beginnen Sie den Zug aus den Schulterblättern, indem Sie diese aktiv nach unten
    und hinten ziehen (Scapula-Depression und -Retraktion), bevor die Arme die Hauptarbeit
    übernehmen.
  - Konzentrieren Sie sich darauf, die Brust zur Stange zu ziehen, nicht nur das Kinn.
    Dies gewährleistet einen vollen Bewegungsumfang und maximale Muskelkontraktion.
  - Halten Sie während der gesamten Bewegung eine stabile Körperspannung, um unnötiges
    Schwingen zu vermeiden.
  - Führen Sie die Abwärtsbewegung kontrolliert und langsam aus, um die exzentrische
    Phase optimal zu nutzen und die Schultern zu schonen.
  common_errors:
  - 'Verkürzter Bewegungsumfang: Nicht vollständig nach unten ablassen oder nicht
    hoch genug ziehen, sodass die Brust nicht zur Stange kommt.'
  - 'Schwungholen (Kipping): Einsatz des Unterkörpers zum Schwungholen nimmt die Spannung
    von der Zielmuskulatur und erhöht das Verletzungsrisiko.'
  - 'Schultern hochziehen: Die Schultern sollten aktiv nach unten gedrückt und fixiert
    bleiben, statt zu den Ohren gezogen zu werden, um die Lats und den Bizeps effektiv
    zu belasten.'
  - 'Fehlende Körperspannung: Ein schlaffer Rumpf führt zu Instabilität und verminderter
    Kraftübertragung.'
  - 'Nur die Arme benutzen: Der Fokus sollte auf dem Ziehen des Rückens liegen, nicht
    nur auf dem Beugen der Arme. Die Schulterblätter aktiv einzusetzen ist entscheidend.'
