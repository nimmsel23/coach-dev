  coaching_notes:
  - '**Einrichtung und Startposition:** Stellen Sie die Sitzhöhe so ein, dass die
    Griffe in der Startposition auf Höhe Ihrer mittleren Brust (Brustwarzenhöhe) positioniert
    sind und Ihre Schultern stabil und leicht nach hinten unten gezogen werden können.
    Halten Sie die Füße fest auf dem Boden, den Rücken stabil an die Lehne gepresst
    und die Handgelenke gerade.'
  - '**Ausführung (Konzentrische Phase):** Drücken Sie die Griffe kontrolliert nach
    vorne, während Sie Ihre Brustmuskulatur bewusst anspannen. Strecken Sie die Arme
    fast vollständig, aber vermeiden Sie ein vollständiges Durchdrücken der Ellenbogen,
    um die Gelenke zu schonen und die Muskelspannung aufrechtzuerhalten. Atmen Sie
    während des Drückens aus.'
  - '**Rückführung (Exzentrische Phase):** Führen Sie die Griffe langsam und kontrolliert
    zurück, wobei Sie die Bewegung nicht abbrechen lassen. Dehnen Sie die Brustmuskulatur
    dabei aktiv und halten Sie die Spannung aufrecht. Atmen Sie während der Rückführung
    ein. Lassen Sie den Gewichtsstapel nicht vollständig aufsetzen, um eine konstante
    Muskelspannung zu gewährleisten und den Bewegungsfluss nicht zu unterbrechen.'
  - '**Fokus:** Konzentrieren Sie sich auf die bewusste Aktivierung Ihrer Brustmuskulatur
    (Mind-Muscle Connection) – stellen Sie sich vor, Sie drücken Ihre Hände zueinander.
    Achten Sie auf eine kontrollierte, gleichmäßige Bewegungsausführung über den gesamten
    Bewegungsumfang.'
  common_errors:
  - '**Falsche Sitzeinstellung:** Wenn die Griffe zu hoch oder zu tief eingestellt
    sind, kann dies zu einer unnatürlichen Belastung der Schultern führen oder die
    Brustmuskulatur ineffektiv trainieren. Korrektur: Die Griffe sollten in der Startposition
    auf Höhe der mittleren Brust sein.'
  - '**Ellenbogen durchdrücken:** Das vollständige Strecken und Blockieren der Ellenbogen
    am Ende der Bewegung kann die Gelenke überlasten. Korrektur: Eine leichte Beugung
    im Ellenbogen beibehalten, um die Gelenke zu schützen und die Muskelspannung zu
    halten.'
  - '**Schultern hochziehen:** Das Hochziehen der Schultern zu den Ohren während des
    Drückens verlagert die Belastung unnötig auf Nacken und Schultern. Korrektur:
    Halten Sie die Schultern aktiv nach unten und hinten gezogen, um die Brust zu
    isolieren.'
  - '**Schwung nutzen / Unkontrollierte Bewegung:** Die Bewegung durch Reißen oder
    zu schnelles Ablassen des Gewichts auszuführen, reduziert die Effektivität und
    erhöht das Verletzungsrisiko. Korrektur: Wählen Sie ein Gewicht, das eine langsame,
    kontrollierte Bewegung in beiden Phasen ermöglicht, insbesondere in der exzentrischen
    Phase.'
  - '**Hohlkreuz:** Ein starkes Hohlkreuz, um mehr Gewicht bewegen zu können, kann
    die Lendenwirbelsäule unnötig belasten. Korrektur: Den Rücken flach an die Lehne
    drücken und die Bauchmuskulatur leicht anspannen, um den Rumpf zu stabilisieren.'
