  coaching_notes:
  - Beginne aus einem stabilen Stand, atme ein, spanne den Rumpf leicht an und rolle
    dann die Wirbelsäule Wirbel für Wirbel von oben nach unten ab.
  - Führe jede Wiederholung langsam und bewusst aus; der Jefferson Curl ist primär
    eine Übung zur Kontrollverbesserung und Gewebeverträglichkeit, kein reiner Krafttest.
  - Lass zuerst das Kinn zur Brust sinken, dann die Brustwirbelsäule und erst zuletzt
    die Lendenwirbelsäule und die Hüfte folgen, um eine echte segmentale Flexion zu
    erreichen.
  - Halte die Last, egal ob Langhantel oder Kettlebell, dicht am Körper und wähle
    nur so viel Gewicht, dass du die segmentale Bewegung ohne Rucken oder unfreiwillige
    Schutzspannung kontrollieren kannst.
  - Gehe nur so tief, wie du Position, Atmung und muskuläre Spannung sauber halten
    kannst; ein moderater, kontrollierter Stretch der Beinrückseite und des Rückens
    ist erwünscht, aber stechender Schmerz oder starke Kompression nicht.
  - Vermeide am tiefsten Punkt eine passive Hängeposition; behalte stattdessen muskuläre
    Kontrolle über den Rumpf und die hintere Kette bei, um die Spannung aufrechtzuerhalten.
  - Rolle dich für den Rückweg ebenso segmental wieder auf und stelle dir vor, wie
    sich die Wirbelsäule von unten nach oben, Wirbel für Wirbel, neu aufstapelt, bis
    du wieder aufrecht stehst.
  - Verteile den Druck gleichmäßig über den ganzen Fuß und halte die Knie weich (leicht
    gebeugt), aber weitgehend ruhig, damit die Bewegung primär aus Wirbelsäule und
    Hüfte organisiert bleibt.
  - Starte konservativ und priorisiere Bewegungsqualität sowie die Erhöhung der Toleranz
    und Gelenkfreiheit im unbelasteten oder sehr leicht belasteten Bereich, bevor
    du die Last erhöhst.
  common_errors:
  - Zu viel Gewicht wählen, was die segmentale Kontrolle beeinträchtigt und die Übung
    in einen unsauberen Rundrücken-Good-Morning verwandelt, der die Wirbelsäule überlastet.
  - Statt segmental abzurollen, nur aus der Hüfte nach vorne klappen und die eigentliche
    Wirbelsäulenarbeit sowie die beabsichtigte Dehnung der Rückenmuskulatur umgehen.
  - Die Übung zu früh als schwere Kraftübung programmieren, bevor die endgradige Flexionskontrolle
    und die Belastungsverträglichkeit der Wirbelsäule aufgebaut wurden.
  - In die Endposition hineinfedern oder mit Schwung tiefer ziehen, obwohl die muskuläre
    Kontrolle bereits verloren ist, was zu Verletzungen führen kann.
  - Schmerz, Kribbeln, elektrisierende Symptome oder starken Nervenzug (z.B. in den
    Beinen) ignorieren und trotzdem weiter in die Tiefe gehen – dies sind klare Warnsignale,
    die beachtet werden müssen.
  - Den tiefsten Punkt passiv aushängen lassen, anstatt Rumpf und hintere Kette aktiv
    unter Spannung zu halten, wodurch der schützende muskuläre Halt fehlt.
  - Die Knie ständig übermäßig beugen und strecken, um fehlende Beweglichkeit der
    Wirbelsäule oder der hinteren Kette zu kompensieren.
  - Beim Aufrollen ruckartig aus der Hüfte hochschießen, anstatt die Wirbelsäule kontrolliert
    und Wirbel für Wirbel wieder aufzubauen.
  - Den Kopf früh in den Nacken nehmen oder die Last vom Körper wegdriften lassen,
    was die Hebelverhältnisse unnötig verschlechtert und den Nacken sowie unteren
    Rücken überlastet.
