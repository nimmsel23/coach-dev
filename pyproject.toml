[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[project]
name = "fitness-agent"
version = "0.1.0"
description = "Local fitness agent foundation CLI"
authors = [
    { name = "Alpha OS team" }
]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "PyYAML>=6.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.54.0",
    "httpx>=0.28.1",
    "rich>=15.0.0",
    "loguru>=0.7.0",
    "watchdog>=3.0.0",
    "wasabi>=1.1.3",
    "typer>=0.9.0",
    "tqdm>=4.70.1",
    "halo>=0.0.31",
    "typing-extensions>=4.16.0",
    "firebase-admin>=7.7.0",
    "rapidfuzz>=3.14.5",
    "textual>=0.58.0",
    "pandas>=3.1.0",
    "sqlalchemy>=2.0.0",
    "alembic>=1.11.0",
    "aiohttp>=3.14.5",
]

[project.scripts]
fitness              = "fitness.cli:main"
fitness-log          = "fitness.log.cli:main"
fitness-tui          = "fitness.tui.cli:main"
fitness-inbox        = "backend.notifier.cli:main"
fitness-push         = "backend.pusher.cli:main"
fitness-activity     = "fitness.activity.cli:main"
fitness-mail         = "fitness.mail.cli:main"
fitness-sync         = "fitness.sync.cli:main"
firestore-sync       = "fitness.firestore.sync_cli:main"
fitness-catalog      = "fitness.catalog.cli:main"
fitness-catalog-api  = "fitness.api.main:main"
fitness-api          = "fitness.api.main:main"
anatomy-agent        = "anatomy_kb.cli:main"

[tool.poetry]
packages = [
    # Dateiglobs verhindern, dass Poetry Laufzeit-Symlinks im Katalog verfolgt.
    { include = "fitness/**/*.py" },
    { include = "backend" },
    { include = "db" },
    { include = "anatomy_kb", from = "anatomy-kb" },
]
include = [
    { path = "fitness/catalog/config.yml", format = ["sdist", "wheel"] },
    { path = "fitness/catalog/data_source_priority.yml", format = ["sdist", "wheel"] },
    { path = "fitness/catalog/py.typed", format = ["sdist", "wheel"] },
]
exclude = ["fitness/catalog/state", "fitness/catalog/kb", "backend/tests", "backend/notifier/bin"]
