<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#100e0a" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="VOS Coach" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="manifest" href="./coach-manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="./coach-icon.svg" />
    <link rel="apple-touch-icon" sizes="180x180" href="./coach-icon-180.png" />
    <title>VitalOS Coach</title>
    <script>
      (function() {
        const theme = localStorage.getItem('fitness-theme') || 'nordic';
        const mode = localStorage.getItem('fitness-theme-mode') || 'manual';
        if (mode === 'manual') {
          document.documentElement.setAttribute('data-theme', theme);
        } else {
          const hour = new Date().getHours();
          const dark = localStorage.getItem('fitness-circ-dark') || 'nordic';
          const light = localStorage.getItem('fitness-circ-light') || 'honey';
          document.documentElement.setAttribute('data-theme', (hour >= 8 && hour < 20) ? light : dark);
        }
      })();
    </script>
    <script type="module" src="/src/coach-main.jsx"></script>
  </head>
  <body>
    <div id="root"></div>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/coach-sw.js', { scope: '/' }).catch(console.error);
        });
      }
    </script>
  </body>
</html>
