muscle_id: forearm_extensors
wger_id: None
latin: Musculi extensores antebrachii
name_en: Forearm extensors
is_front: false
exercises: {}
origin: Primär am Epicondylus lateralis humeri (gemeinsamer Ursprung der Extensoren),
  teilweise auch an der Crista supracondylaris lateralis humeri, der Facies posterior
  ulnae und der Membrana interossea.
insertion: An den Basen der Ossa metacarpi II, III und V, den Dorsalaponeurosen der
  Finger II-V, sowie an den Phalanges des Daumens (Pollex).
innervation: Nervus radialis (N. radialis) (Segmente C6-C8), insbesondere dessen Ramus
  profundus, der distal zum Nervus interosseus posterior wird.
function: Diese Muskelgruppe ist maßgeblich für die Streckung (Extension) im Handgelenk
  (Dorsalextension) und in den Fingergelenken verantwortlich. Zudem tragen einige
  dieser Muskeln zur Abduktion und Adduktion der Hand im Handgelenk bei und unterstützen
  die Supination des Unterarms.
