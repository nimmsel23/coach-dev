muscle_id: soleus
wger_id: 15
latin: Musculus soleus
name_en: ''
is_front: false
origin: Caput fibulae (Fibulaköpfchen), Facies posterior fibulae (hintere Fläche des
  Wadenbeins) und Arcus tendineus musculi solei (Sehnenbogen zwischen Fibula und Tibia)
  sowie Margo medialis tibiae (medialer Rand des Schienbeins).
insertion: Über die Achillessehne (Tendo calcaneus) an der Tuber calcanei (Fersenbeinhöcker).
innervation: Nervus tibialis (L4–S2)
function: Der Muskel bewirkt eine Plantarflexion im oberen Sprunggelenk. Zudem fungiert
  er als wichtiger Haltungsmuskel, der bei aufrechtem Stand ein Nach-vorn-Kippen des
  Körpers verhindert.
