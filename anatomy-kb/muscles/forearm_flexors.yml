muscle_id: forearm_flexors
wger_id: None
latin: Musculi flexores antebrachii
name_en: Forearm flexors
is_front: true
exercises: {}
origin: Ursprung (Origo) — Die oberflächlichen Flexoren entspringen mehrheitlich am
  Epicondylus medialis humeri (medialer Epikondylus des Oberarmknochens) über die
  gemeinsame Beugersehne. Tiefere Muskeln haben Ursprünge am Corpus ulnae (Ellenbogenknochen)
  und Corpus radii (Speiche) sowie am Processus coronoideus ulnae (Kronenfortsatz
  der Elle).
insertion: Ansatz (Insertio) — Die Muskeln inserieren an den Ossa carpi (Handwurzelknochen),
  den Basen der Ossa metacarpalia (Mittelhandknochen), den Phalanges (Fingerknochen),
  der Aponeurosis palmaris (Palmaraponeurose) und am Corpus radii (Schaft der Speiche).
innervation: Nervus medianus (C5-Th1), Nervus ulnaris (C7-Th1)
function: Diese Muskelgruppe ist primär verantwortlich für die Flexion (Beugung) des
  Handgelenks und der Finger. Zudem tragen sie zur Pronation des Unterarms und zur
  Ulnar- bzw. Radialabduktion des Handgelenks bei.
