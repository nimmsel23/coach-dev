muscle_id: triceps_brachii
wger_id: 5
latin: Musculus triceps brachii
name_en: Triceps
is_front: false
origin: 'Caput longum: Tuberculum infraglenoidale der Scapula. Caput laterale: Laterale
  und hintere Fläche des Humerus (proximal des Sulcus nervi radialis). Caput mediale:
  Posteriore Fläche des Humerus (distal des Sulcus nervi radialis).'
insertion: Olecranon der Ulna.
innervation: Nervus radialis (C6-C8).
function: Primärer Agonist für die Extension des Unterarms im Ellenbogengelenk.
exercises:
  bench_press:
    function_in_exercise: Primärer Agonist für die Extension des Unterarms im Ellenbogengelenk,
      entscheidend für das Ausstrecken der Arme gegen den Widerstand beim Hochdrücken
      der Hantel.
  schulterdruecken_mit_hueftschwung:
    function_in_exercise: Streckt den Ellenbogen im oberen Drittel der Bewegung bis
      zum Lockout.
  reissen_und_umsetzen:
    function_in_exercise: Streckt die Arme beim Jerk explosiv durch.
