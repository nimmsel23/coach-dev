muscle_id: brachialis
wger_id: 13
latin: Musculus brachialis
name_en: ''
is_front: true
origin: Distale Hälfte der Vorderfläche des Humerus (Facies anterior humeri) sowie
  das mediale und laterale Septum intermusculare brachii.
insertion: Tuberositas ulnae und Proc. coronoideus ulnae.
innervation: Nervus musculocutaneus (C5–C6), gelegentlich mit einem Ast des Nervus
  radialis.
function: Beugung (Flexion) des Ellenbogengelenks in allen Stellungen des Unterarms
  (Supination und Pronation). Er ist der stärkste reine Flexor des Ellenbogens.
exercises: {}
