muscle_id: obliquus_externus_abdominis
wger_id: 14
latin: Musculus obliquus externus abdominis
name_en: ''
is_front: true
origin: Außenflächen der 5. bis 12. Rippe (Costae V–XII), verzahnt mit dem Musculus
  serratus anterior und dem Musculus latissimus dorsi.
insertion: Labium externum der Beckenkammvorderkante (Crista iliaca), vorderes Blatt
  der Rektusscheide (Vagina musculi recti abdominis) und Linea alba.
innervation: Nervi intercostales (Th5–Th12), Nervus iliohypogastricus und Nervus ilioinguinalis.
function: Bei beidseitiger Kontraktion bewirkt er eine Rumpfbeuge (Flexion) und stabilisiert
  das Becken. Bei einseitiger Kontraktion führt er zur Seitneigung (Lateralflexion)
  zur gleichen Seite und zur Drehung (Rotation) des Rumpfes zur Gegenseite.
exercises: {}
