muscle_id: latissimus_dorsi
wger_id: 12
latin: Musculus latissimus dorsi
name_en: Lats
is_front: false
origin: Dornfortsätze der unteren 6 Brustwirbel (Processus spinosi Th7-Th12), Fascia
  thoracolumbalis, Darmbeinkamm (Crista iliaca), untere 3-4 Rippen (Costae 9-12) und
  Angulus inferior der Schulterblätter (Scapula)
insertion: Crista tuberculi minoris des Oberarmknochens (Humerus)
innervation: Nervus thoracodorsalis (Segmente C6–C8)
function: Der Musculus latissimus dorsi führt als starker Adduktor den Arm zum Körper,
  wirkt als Innenrotator und ist maßgeblich an der Rückführung (Retroversion) des
  Arms beteiligt. Zudem unterstützt er bei fixiertem Oberarm das Anheben des Rumpfes.
