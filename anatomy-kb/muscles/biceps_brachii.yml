muscle_id: biceps_brachii
wger_id: 1
latin: Musculus biceps brachii
name_en: Biceps
is_front: true
origin: 'Caput longum: Tuberculum supraglenoidale (Scapula); Caput breve: Processus
  coracoideus (Scapula)'
insertion: Tuberositas radii (Radius) und über die Aponeurosis musculi bicipitis brachii
  (Lacertus fibrosus) in die Fascia antebrachii
innervation: Nervus musculocutaneus (C5–C6)
function: Der Musculus biceps brachii ist der stärkste Flexor des Ellenbogengelenks
  und der wichtigste Supinator des Unterarms. Zudem unterstützt er die Anteversion
  im Schultergelenk (Caput longum zusätzlich Abduktion, Caput breve Adduktion).
