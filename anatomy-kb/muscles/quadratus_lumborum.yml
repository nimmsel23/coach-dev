muscle_id: quadratus_lumborum
wger_id: None
latin: Musculus quadratus lumborum
name_en: Quadratus lumborum
is_front: false
exercises: {}
origin: Crista iliaca (hinterer Abschnitt) und Ligamentum iliolumbale
insertion: Margo inferior der 12. Rippe (Costa XII) und Processus transversi der Lendenwirbel
  L1–L4
innervation: Nervus subcostalis (Th12) und Rami anteriores der Spinalnerven (L1–L3)
function: Seitwärtsneigung (Lateralflexion) der Wirbelsäule bei einseitiger Kontraktion
  sowie Fixierung bzw. Senkung der 12. Rippe bei der Atmung. Bei beidseitiger Kontraktion
  unterstützt er die Extension der Lendenwirbelsäule.
