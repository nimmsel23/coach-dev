muscle_id: quadriceps_femoris
wger_id: 10
latin: Musculus quadriceps femoris
name_en: Thigh Front
is_front: true
origin: Femur und Spina iliaca anterior inferior.
insertion: Tuberositas tibiae (über Patellarsehne).
innervation: Nervus femoralis (L2-L4).
function: Streckung im Kniegelenk.
exercises:
  back_squat:
    function_in_exercise: Primärer Agonist für die Kniestreckung, verantwortlich für
      die Aufwärtsbewegung aus der Hocke.
  lunge:
    function_in_exercise: Primärer Agonist für die Kniestreckung im vorderen Bein.
  squat:
    function_in_exercise: Primärer Agonist für die Kniestreckung.
  schulterdruecken_mit_hueftschwung:
    function_in_exercise: Erzeugt den initialen Impuls (Drive) durch explosive Kniestreckung.
  reissen_und_umsetzen:
    function_in_exercise: Streckt das Knie beim Zug und stabilisiert beim Catch in
      der Frontbeuge.
  wger_1224:
    function_in_exercise: Primärer Kniestrecker, der die Aufwärtsbewegung aus der
      tiefen Hocke gegen den Widerstand der Hanteln einleitet.
