muscle_id: rectus_abdominis
wger_id: 6
latin: Musculus rectus abdominis
name_en: Abs
is_front: true
origin: Knorpel der 5. bis 7. Rippe (Cartilagines costales), Processus xiphoideus
  des Brustbeins (Sternum)
insertion: Schambein (Os pubis), speziell am Schambeinkamm (Crista pubica) und der
  Schambeinfuge (Symphysis pubica)
innervation: Nervi intercostales (Th5–Th12)
function: Beugung des Rumpfes nach ventral (Flexion der Wirbelsäule) und Unterstützung
  der Bauchpresse sowie Stabilisierung des Beckens.
