muscle_id: trapezius
wger_id: 9
latin: Musculus trapezius
name_en: Upper Back
is_front: false
origin: Os occipitale, Processus spinosi C1-T12.
insertion: Clavicula, Acromion, Spina scapulae.
innervation: Nervus accessorius (XI), Plexus cervicalis (C2-C4).
function: Stabilisierung und Bewegung der Scapula.
exercises:
  back_squat:
    function_in_exercise: Stabilisierung der Scapula, dient als Polster für die Hantel.
  bench_press:
    function_in_exercise: Stabilisiert die Scapula durch Retraktion und Depression.
  schulterdruecken_mit_hueftschwung:
    function_in_exercise: Stabilisiert den Schultergürtel und unterstützt die Upward
      Rotation der Scapula.
  reissen_und_umsetzen:
    function_in_exercise: Zieht die Schultern explosiv nach oben beim Shrug-Anteil
      des Zugs.
