<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#0b1220" />
  <title>COO · Klienten & nächste Schritte · C-Suite</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet" />
  <style>
:root {
  --bg: #0b1220;
  --bg2: #111827;
  --panel: #151c2c;
  --panel2: #1a2336;
  --line: #2a3548;
  --ink: #e8eef7;
  --muted: #93a0b5;
  --accent: #5b8cff;
  --accent2: #3dd6c6;
  --warn: #f0b429;
  --danger: #f07178;
  --ok: #3dd68c;
  --shadow: 0 10px 30px rgba(0,0,0,.35);
  --radius: 14px;
  --font: "IBM Plex Sans", "Segoe UI", sans-serif;
  --display: "Space Grotesk", "IBM Plex Sans", sans-serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; }
body {
  font-family: var(--font);
  color: var(--ink);
  background: var(--bg);
}
button, select, textarea, input { font: inherit; color: inherit; }
button { cursor: pointer; }
.app { max-width: 1480px; margin: 0 auto; padding: 1rem 1.1rem 1.5rem; display: grid; gap: .9rem; }
.header {
  display: flex; flex-wrap: wrap; gap: 1rem; justify-content: space-between; align-items: center;
  padding: 1rem 1.15rem; border: 1px solid var(--line); border-radius: var(--radius);
  background: linear-gradient(180deg, rgba(26,35,54,.95), rgba(17,24,39,.92));
  box-shadow: var(--shadow);
}
.brand { display: flex; gap: .85rem; align-items: center; }
.icon {
  width: 2.5rem; height: 2.5rem; border-radius: 12px; display: grid; place-items: center;
  background: rgba(91,140,255,.15); border: 1px solid rgba(91,140,255,.35);
  color: var(--accent); font-size: 1.2rem;
}
.brand h1 { margin: 0; font-family: var(--display); font-size: 1.25rem; letter-spacing: -.02em; }
.meta { margin: .2rem 0 0; color: var(--muted); font-size: .82rem; display: flex; flex-wrap: wrap; gap: .45rem; align-items: center; }
.badge {
  display: inline-flex; align-items: center; gap: .35rem; padding: .15rem .55rem;
  border-radius: 999px; border: 1px solid var(--line); background: var(--bg2); font-size: .8rem;
}
.badge.ok { border-color: rgba(61,214,140,.35); color: var(--ok); }
.badge.warn { border-color: rgba(240,180,41,.35); color: var(--warn); }
.controls { display: flex; flex-wrap: wrap; gap: .75rem; align-items: center; }
.kpis { display: flex; gap: .55rem; }
.kpi {
  min-width: 5.5rem; padding: .55rem .7rem; border-radius: 12px; border: 1px solid var(--line);
  background: rgba(255,255,255,.03); text-align: center;
}
.kpi .n { display: block; font-family: var(--display); font-size: 1.15rem; font-weight: 700; }
.kpi .l { display: block; color: var(--muted); font-size: .8rem; margin-top: .15rem; }
label.llm { display: grid; gap: .25rem; font-size: .8rem; color: var(--muted); }
label.llm select {
  min-width: 11rem; background: var(--bg2); border: 1px solid var(--line); border-radius: 10px;
  padding: .45rem .6rem;
}
.sync { display: flex; align-items: center; gap: .4rem; font-size: .78rem; color: var(--muted); }
.dot { width: .55rem; height: .55rem; border-radius: 50%; background: var(--warn); box-shadow: 0 0 0 3px rgba(240,180,41,.15); }
.dot.live { background: var(--ok); box-shadow: 0 0 0 3px rgba(61,214,140,.15); }
.grid {
  display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: .85rem; align-items: start;
}
@media (max-width: 1100px) { .grid { grid-template-columns: 1fr; } }
.panel {
  border: 1px solid var(--line); border-radius: var(--radius); background: rgba(21,28,44,.92);
  display: flex; flex-direction: column; min-height: 0; box-shadow: var(--shadow);
}
.panel h2 {
  margin: 0; padding: .85rem 1rem; border-bottom: 1px solid var(--line);
  font-family: var(--display); font-size: .95rem; letter-spacing: .02em;
}
.grid > .panel:first-child { grid-column: 1 / -1; }
.panel { min-width: 0; }
.skill { overflow-wrap: anywhere; }
.skill-picker summary { cursor: pointer; padding: .5rem 0; }
.panel-body { padding: .85rem; overflow: auto; display: grid; gap: .75rem; flex: 1; }
.card {
  border: 1px solid var(--line); border-radius: 12px; background: var(--panel2); padding: .85rem .9rem;
}
.card h3 { margin: 0 0 .25rem; font-size: .95rem; }
.card .sub { margin: 0 0 .55rem; color: var(--muted); font-size: .78rem; }
.card ul { margin: 0 0 .7rem; padding-left: 1.1rem; color: #d5deea; }
.card li { margin: .2rem 0; }
.actions { display: flex; flex-wrap: wrap; gap: .4rem; }
.btn {
  border: 1px solid var(--line); background: rgba(91,140,255,.12); color: var(--ink);
  border-radius: 10px; padding: .45rem .7rem; font-size: .82rem;
}
.btn:hover { border-color: rgba(91,140,255,.55); background: rgba(91,140,255,.2); }
.btn.ghost { background: transparent; }
.btn.ok { background: rgba(61,214,140,.12); border-color: rgba(61,214,140,.35); }
.btn.danger { background: rgba(240,113,120,.1); border-color: rgba(240,113,120,.35); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.skills { display: grid; grid-template-columns: 1fr 1fr; gap: .55rem; }
.skill {
  text-align: left; border: 1px solid var(--line); border-radius: 12px; padding: .7rem .75rem;
  background: linear-gradient(180deg, rgba(91,140,255,.08), rgba(255,255,255,.02));
}
.skill strong { display: block; font-size: .88rem; }
.skill span { display: block; color: var(--muted); font-size: .8rem; margin-top: .2rem; }
.chat {
  border: 1px solid var(--line); border-radius: 12px; background: var(--bg2);
  min-height: 220px; max-height: 340px; overflow: auto; padding: .7rem; display: grid; gap: .55rem;
}
.msg { font-size: .84rem; line-height: 1.45; }
.msg .who { color: var(--accent2); font-weight: 650; margin-right: .35rem; }
.msg.system .who { color: var(--warn); }
.msg.user .who { color: var(--accent); }
.composer { display: grid; gap: .5rem; }
.composer textarea {
  width: 100%; min-height: 74px; resize: vertical; border-radius: 12px;
  border: 1px solid var(--line); background: var(--bg2); padding: .7rem .8rem;
}
.composer-row { display: flex; justify-content: space-between; gap: .5rem; align-items: center; }
.hint { color: var(--muted); font-size: .8rem; }
.queue-card textarea {
  width: 100%; min-height: 120px; border-radius: 10px; border: 1px solid var(--line);
  background: var(--bg); padding: .65rem .7rem; margin: .55rem 0 .7rem;
}
.empty { color: var(--muted); font-size: .85rem; margin: 0; }
footer.note { color: var(--muted); font-size: .8rem; }
footer.note code { color: var(--accent2); }
.coo-roster { display: grid; grid-template-columns: minmax(16rem, 1fr) 1fr; gap: 1rem; border-bottom: 1px solid var(--line); padding-bottom: 1rem; }
.coo-roster label { display: grid; gap: .5rem; align-content: start; }
.coo-roster select { width: 100%; background: var(--bg2); border: 1px solid var(--line); padding: .65rem; border-radius: 8px; }
.coo-roster p { margin: .4rem 0; }
.coo-context-head { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: .75rem; }
.coo-context-head h3 { margin-bottom: .25rem; }
.coo-actions { margin: .75rem 0; }
.coo-context-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 1.2rem; }
.coo-context-grid section { min-width: 0; }
.coo-context-grid h4 { margin: 1rem 0 .6rem; }
.coo-context-grid p, .coo-context-grid li { font-size: .9rem; line-height: 1.5; overflow-wrap: anywhere; white-space: pre-wrap; }
.coo-context-grid ul { padding-left: 1.2rem; }
.coo-context-grid li { margin-bottom: .6rem; }
.coo-context-grid pre { white-space: pre-wrap; font-family: inherit; font-size: .9rem; max-height: 24rem; overflow: auto; }
.coo-context-grid summary { cursor: pointer; padding: .5rem 0; }
@media (max-width: 800px) { .coo-roster, .coo-context-grid { grid-template-columns: minmax(0, 1fr); } }
.draft-prose { max-width:75ch; overflow-wrap:anywhere; line-height:1.65; margin:1rem 0; }
.draft-prose h1 { font-size:1.4rem; } .draft-prose h2 { font-size:1.2rem; } .draft-prose h3 { font-size:1.05rem; }
.draft-prose :is(h1,h2,h3,h4) { margin:1.5em 0 .5em; } .draft-prose p { white-space:normal; }
.draft-prose pre { overflow:auto; white-space:pre; padding:1rem; background:var(--panel); }
.draft-prose table { display:block; overflow:auto; border-collapse:collapse; } .draft-prose :is(td,th) { padding:.5rem; border:1px solid var(--line); }
.draft-prose a { color:inherit; text-decoration:underline; } [hidden] { display:none !important; }
</style>
</head>
<body>
  <div class="app">
    <header class="header">
      <div class="brand">
        <div class="icon" aria-hidden="true"></div>
        <div>
          <h1></h1>
          <p class="meta">
            <span class="badge git-badge"></span>
            <span class="badge warn">Du prüfst und entscheidest</span>
          </p>
        </div>
      </div>
      <div class="controls">
        <div class="kpis" aria-label="KPIs"></div>
        <div class="sync"><span class="dot"></span><span class="sync-label">Sync…</span></div>
        <label class="llm">Modell
          <select id="model" aria-label="LLM wählen"></select>
        </label>
      </div>
    </header>

    <div class="grid">
      <section class="panel" aria-label="Ablauf">
        <h2>Dein COO-Arbeitsplatz</h2>
        <div class="panel-body" id="focus"></div>
      </section>
      <section class="panel" aria-label="Konsole">
        <h2>Eigener Auftrag zum Klienten</h2>
        <div class="panel-body">
          <details class="skill-picker"><summary id="skill-label">Skill wählen (optional)</summary><div class="skills" id="launcher"></div></details>
          <div class="chat" id="chat" aria-live="polite"></div>
          <form class="composer" id="composer">
            <textarea id="prompt" placeholder="Was soll der COO für diesen Klienten vorbereiten?" aria-label="Chat"></textarea>
            <div class="composer-row">
              <span class="hint">Git-Brain: workspaces/coo/</span>
              <button class="btn" type="submit">Auftrag starten</button>
            </div>
          </form>
        </div>
      </section>
      <section class="panel" aria-label="Freigaben">
        <h2>Aufträge & Ergebnisse</h2>
        <div class="panel-body" id="queue"></div>
      </section>
    </div>

    <footer class="note">
      Coach-only · <code>/api/csuite/run</code> · Aufträge und Dokumente: lokale Coach-Runtime
      · <a href="http://127.0.0.1:9150/coach/coo" style="color:var(--accent)">Lokalen Coach öffnen</a> · zurück zum <a href="/coach/" style="color:var(--accent)">Hub</a>
    </footer>
  </div>
  <script type="module">
import { renderMarkdown } from '/workspaces/_shared/markdown.js';
import { createJobAdapter, runWorkspace, copyText } from '/workspaces/_shared/runtime.js';
import { mountCooFrontdoor, selectedClientContext } from '/workspaces/_shared/coo.js';
const ROLE = {"id": "coo", "title": "COO · Klienten & nächste Schritte", "icon": "◎", "gitBadge": "Rolle aus Git", "kpis": [], "focus": [], "launcher": []};

/** Git-as-a-Brain: load prompt + skills from same workspace folder (no Firestore sync). */
let BRAIN = { systemPrompt: "", skillsConfig: null, loaded: false };

async function loadWorkspaceBrain() {
  try {
    const base = `/workspaces/${ROLE.id}`;
    const [promptRes, skillsRes] = await Promise.all([
      fetch(`${base}/system-prompt.md`, { cache: "no-cache" }),
      fetch(`${base}/skills.json`, { cache: "no-cache" }),
    ]);
    if (!promptRes.ok || !skillsRes.ok) {
      throw new Error(`HTTP ${promptRes.status}/${skillsRes.status}`);
    }
    const systemPrompt = await promptRes.text();
    const skillsConfig = await skillsRes.json();
    BRAIN = { systemPrompt, skillsConfig, loaded: true };
    if (skillsConfig?.version) {
      ROLE.gitBadge = `Rolle: ${ROLE.id} · v${skillsConfig.version}`;
    }
    if (Array.isArray(skillsConfig?.tools)) {
      ROLE.brainToolNames = skillsConfig.tools.map((t) => t.name);
    }
    return BRAIN;
  } catch (err) {
    console.warn("[csuite] loadWorkspaceBrain failed", err);
    BRAIN = { systemPrompt: "", skillsConfig: null, loaded: false, error: String(err?.message || err) };
    return BRAIN;
  }
}


const MODELS = [
  { id: "gemini", label: "Gemini" },
  { id: "claude", label: "Claude" },
  { id: "codex", label: "Codex" },
];

const LS = {
  model: `csuite-${ROLE.id}-model`,
  queue: `csuite-${ROLE.id}-queue-v1`,
  chat: `csuite-${ROLE.id}-chat-v1`,
};

function uid() {
  return `local_${Date.now().toString(36)}_${Math.random().toString(36).slice(2, 7)}`;
}
function now() { return new Date().toISOString(); }
function fmtTime(iso) {
  try { return new Date(iso).toLocaleString("de-AT", { dateStyle: "short", timeStyle: "short" }); }
  catch { return iso; }
}
function readLs(key, fallback) {
  try { return JSON.parse(localStorage.getItem(key) || "null") ?? fallback; }
  catch { return fallback; }
}
function writeLs(key, value) { localStorage.setItem(key, JSON.stringify(value)); }

const jobAdapter = createJobAdapter(ROLE.id, {
  onConnection: (mode) => {
    $(".dot").classList.toggle("live", mode === "coach");
    $(".sync-label").textContent = mode === "coach" ? "Runtime verbunden" : "Runtime nicht verbunden";
  },
  onQueue: (items) => {
    state.queue = items;
    try { renderQueue(); } catch (_) {}
  },
});

/** Start a durable job. Errors remain errors. */
export const llmRouter = {
  model: ["gemini", "claude", "codex"].includes(readLs(LS.model, "gemini")) ? readLs(LS.model, "gemini") : "gemini",
  setModel(id) { this.model = id; writeLs(LS.model, id); },
  async run({ skillId, context = {}, message = null }) {
    const selected = selectedClientContext();
    if (!selected) throw new Error("Bitte zuerst einen Klienten auswählen und den Stand laden.");
    return runWorkspace({ workspaceId: ROLE.id, skillId: skillId || null, engine: this.model, context, message, ...selected });
  },
};


const state = {
  queue: [],
  chat: readLs(LS.chat, []),
  busy: false,
  sync: "offline",
};

const $ = (sel) => document.querySelector(sel);

function log(role, text) {
  state.chat.push({ id: uid(), role, text, at: now() });
  state.chat = state.chat.slice(-100);
  writeLs(LS.chat, state.chat);
  renderChat();
}

function renderHeader() {
  $(".brand h1").textContent = ROLE.title;
  $(".icon").textContent = ROLE.icon;
  $(".git-badge").textContent = ROLE.gitBadge;
  const kpiRoot = $(".kpis");
  kpiRoot.innerHTML = ROLE.kpis.map((k) => {
    const val = k.id === "queue" ? String(state.queue.filter((q) => q.status === "pending_approval").length) : k.value;
    return `<div class="kpi"><span class="n">${val}</span><span class="l">${k.label}</span></div>`;
  }).join("");
  const sel = $("#model");
  sel.innerHTML = MODELS.map((m) => `<option value="${m.id}" ${m.id === llmRouter.model ? "selected" : ""}>${m.label}</option>`).join("");
}

function renderFocus() {
  const root = $("#focus");
  if (!ROLE.focus.length) { root.innerHTML = `<p class="empty">Skill wählen → Auftrag beschreiben → Ergebnis prüfen → freigeben → Dokument ablegen. Alle Schritte bleiben im Verlauf erhalten. Grundlage sind die Rollenbeschreibung und deine Angaben; Klientendaten werden nicht automatisch geladen.</p>`; return; }
  root.innerHTML = ROLE.focus.map((card, idx) => `
    <article class="card" data-focus="${idx}">
      <h3>${card.title}</h3>
      <p class="sub">${card.meta}</p>
      <ul>${card.bullets.map((b) => `<li>${b}</li>`).join("")}</ul>
      <div class="actions">
        ${card.skills.map(([id, label]) => `<button class="btn" data-skill="${id}" data-focus="${idx}">${label}</button>`).join("")}
      </div>
    </article>`).join("");
}

function renderLauncher() {
  $("#launcher").innerHTML = ROLE.launcher.map((s) => `
    <button class="skill" data-launch="${s.id}" type="button">
      <strong>${s.title}</strong><span>${s.sub}</span>
    </button>`).join("");
}

function renderChat() {
  const root = $("#chat");
  if (!state.chat.length) {
    root.innerHTML = `<p class="empty">Konsole bereit — Skills oder Chat nutzen.</p>`;
    return;
  }
  root.innerHTML = state.chat.map((m) => `
    <div class="msg ${m.role}"><span class="who">${m.role === "user" ? "Du" : m.role === "system" ? "System" : ROLE.id.toUpperCase()}</span>${escapeHtml(m.text)}</div>
  `).join("");
  root.scrollTop = root.scrollHeight;
}

function draftTitle(item) {
  const ctx = item.context || {};
  const brief = ctx.brief || '';
  const title = {prepare:'Gesprächsvorbereitung', review:'Trainingsstand', followup:'Follow-up'}[ctx.operation]
    || (brief.startsWith('Bereite das nächste Gespräch') ? 'Gesprächsvorbereitung' : brief.startsWith('Prüfe den dokumentierten Trainingsstand') ? 'Trainingsstand' : null)
    || (item.skillId === 'draft_followup_email' ? 'Follow-up' : null)
    || item.preview?.match(/^#\s+(.+)$/m)?.[1] || item.title;
  return title + (ctx.clientName && !title.includes(ctx.clientName) ? ` · ${ctx.clientName}` : '');
}
function renderQueue() {
  const root = $("#queue");
  const labels = { queued: "Wartet", running: "Wird erstellt", pending_approval: "Bitte prüfen", approved: "Freigegeben", rejected: "Abgelehnt", completed: "Dokument abgelegt", failed: "Fehlgeschlagen" };
  const drafts = new Map([...root.querySelectorAll('textarea:not([readonly])')].map(el => [el.dataset.edit, { value: el.value, editing: !el.hidden, revision: el.dataset.revision, focused: el === document.activeElement, start: el.selectionStart, end: el.selectionEnd }]));
  const clientId = selectedClientContext()?.clientId;
  const visibleJobs = clientId ? state.queue.filter(item => item.context?.clientId === clientId) : state.queue;
  root.innerHTML = visibleJobs.length ? visibleJobs.map((item) => `
    <article class="card queue-card" data-id="${item.id}">
      <h3>${escapeHtml(draftTitle(item))}</h3>
      <p class="sub">${labels[item.status] || escapeHtml(item.status)} · ${fmtTime(item.updatedAt)}</p>
      ${item.error ? `<p role="alert">${escapeHtml(item.error)}</p>` : ""}
      ${item.preview ? `<div class="draft-prose" data-preview="${item.id}">${renderMarkdown(drafts.get(item.id)?.value ?? item.preview)}</div><textarea hidden aria-label="Entwurf bearbeiten" data-edit="${item.id}" data-revision="${item.revision}" ${item.status !== "pending_approval" ? "readonly" : ""}>${escapeHtml(item.preview)}</textarea>` : ""}
      ${item.status === 'pending_approval' && item.context?.clientId ? `<p class="hint">Freigabe speichert und committet diesen Text in business-vitaltraining · klienten/freigaben/${escapeHtml(item.context.clientId)}/. Kein automatischer Push.</p>` : ''}
      ${item.git ? `<p class="hint">Committed · ${escapeHtml(item.git.commit.slice(0, 8))}<br>${escapeHtml(item.git.repository)} · ${escapeHtml(item.git.path)}</p>` : ''}
      <div class="actions">
        ${item.status === "pending_approval" ? `<button class="btn ok" data-approve="${item.id}"> ${item.context?.clientId ? "Freigeben & committen" : "Entwurf freigeben"}</button><button class="btn" data-toggle-edit="${item.id}">${drafts.get(item.id)?.editing ? "Vorschau" : "Bearbeiten"}</button>` : ""}
        ${["pending_approval", "approved"].includes(item.status) && !item.git ? `<button class="btn danger" data-reject="${item.id}">Ablehnen</button>` : ""}
        ${item.status === "approved" && !item.git ? `<button class="btn ok" data-complete="${item.id}">Als Dokument ablegen</button>` : ""}
        ${item.status === "completed" || item.git ? `<a class="btn" href="/api/csuite/runs/${item.id}/document">Dokument herunterladen</a>` : ""}
        ${item.preview ? `<button class="btn ghost" data-copy="${item.id}">Kopieren</button>` : ""}
      </div>
    </article>`).join("") : `<p class="empty">Noch keine Aufträge zu dieser Auswahl. Starte oben eine Gesprächsvorbereitung oder beschreibe einen eigenen Auftrag.</p>`;
  for (const el of root.querySelectorAll('textarea:not([readonly])')) {
    const draft = drafts.get(el.dataset.edit);
    if (!draft) continue;
    el.value = draft.value;
    el.hidden = !draft.editing;
    root.querySelector(`[data-preview="${el.dataset.edit}"]`).hidden = draft.editing;
    el.dataset.revision = draft.revision;
    if (draft.focused) { el.focus(); el.setSelectionRange(draft.start, draft.end); }
  }
  renderHeader();
}

function escapeHtml(s) {
  return String(s ?? "")
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;");
}

let selectedSkill = null;
async function loadJobs() {
  try { state.queue = await jobAdapter.listApprovals(); }
  catch (error) { log("system", error.message); state.queue = []; }
}
async function runSkill(skillId, context = {}) {
  if (state.busy) return;
  state.busy = true;
  try {
    const result = await llmRouter.run({ skillId, context });
    log("system", `Auftrag gespeichert. ${result.engine} erstellt den Entwurf; der Status bleibt nach dem Neuladen erhalten.`);
    try { state.queue = await jobAdapter.listApprovals(); renderQueue(); }
    catch (error) { log("system", `Auftrag gespeichert; Status gerade nicht abrufbar: ${error.message}`); }
    return true;
  } catch (error) { log("system", `Auftrag nicht gestartet: ${error.message}`); return false; }
  finally { state.busy = false; }
}
async function runChat(text) {
  return runSkill(null, { brief: text });
}

function wire() {
  $("#model").addEventListener("change", (e) => {
    llmRouter.setModel(e.target.value);
    log("system", `Modell gewechselt → ${e.target.value}`);
  });
  $("#focus").addEventListener("click", (e) => {
    const btn = e.target.closest("[data-skill]");
    if (!btn) return;
    const card = ROLE.focus[Number(btn.dataset.focus)];
    runSkill(btn.dataset.skill, { ...(card?.ctx || {}) });
  });
  $("#launcher").addEventListener("click", (e) => {
    const btn = e.target.closest("[data-launch]");
    if (!btn) return;
    const id = btn.dataset.launch;
    selectedSkill = id;
    $("#skill-label").textContent = `Gewählt: ${btn.querySelector("strong").textContent}`;
    $(".skill-picker").open = false;
    $("#prompt").placeholder = `Auftrag für ${id}: Ziel, Fakten und gewünschtes Ergebnis …`;
    $("#prompt").focus();
    log("system", `Skill gewählt: ${id}. Beschreibe jetzt deinen Auftrag im Textfeld.`);
  });
  $("#queue").addEventListener("click", async (e) => {
    const toggle = e.target.closest('[data-toggle-edit]');
    if (toggle) {
      const ta = $("#queue").querySelector(`[data-edit="${toggle.dataset.toggleEdit}"]`);
      const preview = $("#queue").querySelector(`[data-preview="${toggle.dataset.toggleEdit}"]`);
      ta.hidden = !ta.hidden;
      preview.hidden = !ta.hidden;
      preview.innerHTML = renderMarkdown(ta.value);
      toggle.textContent = ta.hidden ? 'Bearbeiten' : 'Vorschau';
      if (!ta.hidden) ta.focus();
      return;
    }
    const approve = e.target.closest("[data-approve]");
    const copyBtn = e.target.closest("[data-copy]");
    const reject = e.target.closest("[data-reject]");
    const readItem = (id) => {
      const ta = document.querySelector(`textarea[data-edit="${id}"]`);
      const item = state.queue.find((q) => q.id === id);
      if (!item) return null;
      if (ta) item.revision = Number(ta.dataset.revision);
      item.preview = ta?.value ?? item.preview;
      return item;
    };
    if (copyBtn) {
      const item = readItem(copyBtn.dataset.copy);
      if (!item) return;
      const ok = await copyText(item.preview);
      log("system", ok ? `Kopiert: ${item.title}` : `Kopieren fehlgeschlagen: ${item.title}`);
      return;
    }
    try {
    if (e.target.closest("[data-complete]")) {
      const item = readItem(e.target.closest("[data-complete]").dataset.complete);
      if (!item) return;
      item.status = "completed";
      await jobAdapter.upsertApproval(item);
      state.queue = await jobAdapter.listApprovals();
      renderQueue();
      log("system", "Freigegebenes Dokument dauerhaft abgelegt.");
    }
    if (approve) {
      const id = approve.dataset.approve;
      const item = readItem(id);
      if (!item) return;
      item.status = "approved";
      item.updatedAt = now();
      await jobAdapter.upsertApproval(item);
      state.queue = await jobAdapter.listApprovals();
      log("system", `Freigegeben: ${draftTitle(item)}. ${item.context?.clientId ? "Dokument im Vitaltraining-Repository committed." : "Du kannst das Dokument jetzt ablegen."}`);
      renderQueue();
    }
    if (reject) {
      const id = reject.dataset.reject;
      await jobAdapter.removeApproval(id);
      state.queue = await jobAdapter.listApprovals();
      log("system", `Abgelehnt und im Verlauf gespeichert: ${id}`);
      renderQueue();
    }
    } catch (error) {
      log("system", `Änderung nicht gespeichert: ${error.message}`);
      await loadJobs(); renderQueue();
    }
  });
  const form = $("#composer");
  const input = $("#prompt");
  form.addEventListener("submit", (e) => {
    e.preventDefault();
    const text = input.value.trim();
    if (!text || state.busy) return;
    log("user", text);
    const skill = selectedSkill;
    (skill ? runSkill(skill, { brief: text }) : runChat(text)).then((started) => {
      if (started) { input.value = ""; selectedSkill = null; $("#skill-label").textContent = "Skill wählen (optional)"; input.placeholder = "Beschreibe deinen Auftrag …"; }
    });
  });
  input.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey) {
      e.preventDefault();
      form.requestSubmit();
    }
  });
}

async function boot() {
  const conn = await jobAdapter.connect();
  state.sync = conn.mode;
  $(".dot").classList.toggle("live", conn.mode === "coach");
  $(".sync-label").textContent = conn.mode === "coach" ? "Runtime verbunden" : "Runtime nicht verbunden";
  if (conn.note) log("system", conn.note);
  const brain = await loadWorkspaceBrain();
  ROLE.focus = [];
  ROLE.kpis = [{ id: "queue", label: "Offene Freigaben", value: "0" }];
  if (brain.loaded) ROLE.launcher = (brain.skillsConfig.tools || brain.skillsConfig.skills || []).map((tool) => ({ id: tool.name || tool.id, title: (tool.name || tool.id).replaceAll("_", " "), sub: tool.description || "" }));
  await loadJobs();
  renderHeader();
  await mountCooFrontdoor($("#focus"), { onAction: runSkill, onSelect: renderQueue });
  renderLauncher();
  renderChat();
  renderQueue();
  wire();
  if (!state.chat.length) {
    const brainNote = brain.loaded
      ? `Brain: system-prompt.md + skills.json v${brain.skillsConfig?.version || "?"}`
      : `Rollenbeschreibung nicht geladen (${brain.error || "offline"}). Bitte neu laden.`;
    log("system", `${ROLE.id.toUpperCase()}-Cockpit · ${brainNote} · Bridge /api/csuite/run`);
  }
}

boot();

  </script>
</body>
</html>
