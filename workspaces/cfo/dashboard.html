:root {

* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; }
body {
  font-family: var(--font);
  color: var(--ink);
  background:
    radial-gradient(900px 400px at 10% -10%, rgba(91,140,255,.18), transparent 50%),

button, select, textarea, input { font: inherit; color: inherit; }
button { cursor: pointer; }
.app { max-width: 1480px; margin: 0 auto; padding: 1rem 1.1rem 1.5rem; display: grid; gap: .9rem; }
.header {
  display: flex; flex-wrap: wrap; gap: 1rem; justify-content: space-between; align-items: center;
  padding: 1rem 1.15rem; border: 1px solid var(--line); border-radius: var(--radius);
  background: linear-gradient(180deg, rgba(26,35,54,.95), rgba(17,24,39,.92));
  box-shadow: var(--shadow);
}
.brand { display: flex; gap: .85rem; align-items: center; }

  width: 2.5rem; height: 2.5rem; border-radius: 12px; display: grid; place-items: center;

}
.badge.ok { border-color: rgba(61,214,140,.35); color: var(--ok); }
.badge.warn { border-color: rgba(240,180,41,.35); color: var(--warn); }
.controls { display: flex; flex-wrap: wrap; gap: .75rem; align-items: center; }
.kpis { display: flex; gap: .55rem; }
.kpi {

label.llm { display: grid; gap: .25rem; font-size: .72rem; color: var(--muted); }

.panel {

const ROLE = {"id": "cfo", "title": "KI-CFO · Umsatz & Belege", "icon": "▣", "gitBadge": "Git: main@cfo-v1.0", "kpis": [{"id": "revenue", "label": "Umsatz MTD", "value": "fehlt"}, {"id": "open", "label": "Offene Posten", "value": "2"}, {"id": "queue", "label": "Mahn-Entwürfe", "value": "1"}], "focus": [{"title": "Offen · Klient Schmidt", "meta": "€480 · fällig vor 8 Tagen", "bullets": ["10er-Block Rate 3/10", "Keine Erinnerung diese Woche", "Kanal: E-Mail bevorzugt"], "skills": [["draft_invoice_reminder", "Erinnerung"], ["open_items_list", "Alle Offenen"]], "ctx": {"clientName": "Schmidt", "amount": "480€", "dueDate": "2026-11-16"}}, {"title": "Monats-Snapshot November", "meta": "Buchhaltung · intern", "bullets": ["Konsole/CRM als Quelle — Zahlen nicht raten", "Belege: Tools/Hosting markieren", "Cashflow 14 Tage unsicher ohne Bank-Export"], "skills": [["summarize_month_revenue", "Umsatz"], ["cashflow_snapshot", "Cashflow"]], "ctx": {"month": "2026-11", "horizonDays": 14}}], "launcher": [{"id": "summarize_month_revenue", "title": "Monatsumsatz", "sub": "Snapshot"}, {"id": "draft_invoice_reminder", "title": "Erinnerung", "sub": "Offener Posten"}, {"id": "package_price_check", "title": "Preis-Check", "sub": "Paket"}, {"id": "expense_note", "title": "Belegnotiz", "sub": "Ausgabe erfassen"}], "mockQueue": [{"title": "Zahlungserinnerung · Schmidt", "skillId": "draft_invoice_reminder", "preview": "Hallo Herr Schmidt,\n\nkurz zur offenen Rechnung über 480€ (fällig 16.11.).\nFalls schon unterwegs — danke. Sonst einfach kurz Bescheid.\n\nFreundliche Grüße\nDaniel"}]};

/** Git-as-a-Brain: load prompt + skills from same workspace folder (no Firestore sync). */
let BRAIN = { systemPrompt: "", skillsConfig: null, loaded: false };

async function loadWorkspaceBrain() {
  try {
    const base = `/coach/workspaces/${ROLE.id}`;
    const [promptRes, skillsRes] = await Promise.all([
      fetch(`${base}/system-prompt.md`, { cache: "no-cache" }),
      fetch(`${base}/skills.json`, { cache: "no-cache" }),
    ]);
    if (!promptRes.ok || !skillsRes.ok) {
      throw new Error(`HTTP ${promptRes.status}/${skillsRes.status}`);
    }
    const systemPrompt = await promptRes.text();
    const skillsConfig = await skillsRes.json();
    BRAIN = { systemPrompt, skillsConfig, loaded: true };
    if (skillsConfig?.version) {
      ROLE.gitBadge = `Git: main@${ROLE.id}-v${skillsConfig.version}`;
    }
    if (Array.isArray(skillsConfig?.tools)) {
      ROLE.brainToolNames = skillsConfig.tools.map((t) => t.name);
    }
    return BRAIN;
  } catch (err) {
    console.warn("[csuite] loadWorkspaceBrain failed", err);
    BRAIN = { systemPrompt: "", skillsConfig: null, loaded: false, error: String(err?.message || err) };
    return BRAIN;
  }
}


const MODELS = [
  { id: "claude", label: "Claude (CLI / Bridge)" },
  { id: "gpt", label: "GPT (OpenRouter)" },
  { id: "gemini", label: "Gemini API" },
  { id: "local", label: "Lokal / Stub" },
];

const LS = {
  model: `csuite-${ROLE.id}-model`,
  queue: `csuite-${ROLE.id}-queue-v1`,
  chat: `csuite-${ROLE.id}-chat-v1`,
};

function uid() {
  return `local_${Date.now().toString(36)}_${Math.random().toString(36).slice(2, 7)}`;
}
function now() { return new Date().toISOString(); }
function fmtTime(iso) {
  try { return new Date(iso).toLocaleString("de-AT", { dateStyle: "short", timeStyle: "short" }); }
  catch { return iso; }
}
function readLs(key, fallback) {
  try { return JSON.parse(localStorage.getItem(key) || "null") ?? fallback; }
  catch { return fallback; }
}
function writeLs(key, value) { localStorage.setItem(key, JSON.stringify(value)); }

/** Firebase adapter — wire config later; mock/localStorage until then. */
export const firebaseAdapter = {
  mode: "mock",
  async connect() {
    this.mode = "mock";
    return { ok: true, mode: "mock", note: "Keine Firebase-Config — localStorage." };
  },
  async listApprovals() { return readLs(LS.queue, []); },
  async upsertApproval(item) {
    const list = await this.listApprovals();
    const i = list.findIndex((x) => x.id === item.id);
    if (i >= 0) list[i] = item; else list.unshift(item);
    writeLs(LS.queue, list);
    return item;
  },
  async removeApproval(id) {
    writeLs(LS.queue, (await this.listApprovals()).filter((x) => x.id !== id));
  },
};

/** LLM / agent router — prefers Coach bridge, else realistic mock. */
export const llmRouter = {
  model: readLs(LS.model, "gemini"),
  setModel(id) { this.model = id; writeLs(LS.model, id); },
  async run({ skillId, context = {}, message = null }) {
    const body = {
      workspaceId: ROLE.id,
      skillId: skillId || null,
      engine: this.model === "local" ? "stub" : this.model === "gpt" ? "issue" : this.model,
      context,
      message,
      systemPrompt: BRAIN.systemPrompt || undefined,
      skills: BRAIN.skillsConfig || undefined,
    };
    try {
      const res = await fetch("/api/csuite/run", {
        method: "POST",
        headers: { "Content-Type": "application/json", Accept: "application/json" },
        body: JSON.stringify(body),
      });
      if (res.ok) {
        const data = await res.json();
        if (data?.preview) {
          return {
            ok: true,
            engine: data.engine || this.model,
            title: data.title || skillId || "Antwort",
            preview: data.preview,
            requiresApproval: Boolean(data.requiresApproval ?? true),
            source: "bridge",
          };
        }
      }
    } catch (_) { /* fall through to mock */ }
    return mockRun(skillId, context, message, this.model);
  },
};

const state = {
  queue: [],
  chat: readLs(LS.chat, []),
  busy: false,
  sync: "mock",
};

const $ = (sel) => document.querySelector(sel);

function log(role, text) {
  state.chat.push({ id: uid(), role, text, at: now() });
  state.chat = state.chat.slice(-100);
  writeLs(LS.chat, state.chat);
  renderChat();
}

function renderHeader() {
  $(".brand h1").textContent = ROLE.title;
  $(".icon").textContent = ROLE.icon;
  $(".git-badge").textContent = ROLE.gitBadge;
  const kpiRoot = $(".kpis");
  kpiRoot.innerHTML = ROLE.kpis.map((k) => {
    const val = k.id === "queue" ? String(state.queue.filter((q) => q.status === "pending_approval").length) : k.value;
    return `<div class="kpi"><span class="n">${val}</span><span class="l">${k.label}</span></div>`;
  }).join("");
  const sel = $("#model");
  sel.innerHTML = MODELS.map((m) => `<option value="${m.id}" ${m.id === llmRouter.model ? "selected" : ""}>${m.label}</option>`).join("");
}

function renderFocus() {
  const root = $("#focus");
  root.innerHTML = ROLE.focus.map((card, idx) => `
    <article class="card" data-focus="${idx}">
      <h3>${card.title}</h3>
      <p class="sub">${card.meta}</p>
      <ul>${card.bullets.map((b) => `<li>${b}</li>`).join("")}</ul>
      <div class="actions">
        ${card.skills.map(([id, label]) => `<button class="btn" data-skill="${id}" data-focus="${idx}">${label}</button>`).join("")}
      </div>
    </article>`).join("");
}

function renderLauncher() {
  $("#launcher").innerHTML = ROLE.launcher.map((s) => `
    <button class="skill" data-launch="${s.id}" type="button">
      <strong>${s.title}</strong><span>${s.sub}</span>
    </button>`).join("");
}

function renderChat() {
  const root = $("#chat");
  if (!state.chat.length) {
    root.innerHTML = `<p class="empty">Konsole bereit — Skills oder Chat nutzen.</p>`;
    return;
  }
  root.innerHTML = state.chat.map((m) => `
    <div class="msg ${m.role}"><span class="who">${m.role === "user" ? "Du" : m.role === "system" ? "System" : ROLE.id.toUpperCase()}</span>${escapeHtml(m.text)}</div>
  `).join("");
  root.scrollTop = root.scrollHeight;
}

function renderQueue() {
  const root = $("#queue");
  const pending = state.queue.filter((q) => q.status === "pending_approval");
  if (!pending.length) {
    root.innerHTML = `<p class="empty">Keine offenen Freigaben.</p>`;
    renderHeader();
    return;
  }
  root.innerHTML = pending.map((item) => `
    <article class="card queue-card" data-id="${item.id}">
      <h3>${escapeHtml(item.title)}</h3>
      <p class="sub">${escapeHtml(item.skillId)} · ${fmtTime(item.createdAt)}</p>
      <textarea data-edit="${item.id}">${escapeHtml(item.preview)}</textarea>
      <div class="actions">
        <button class="btn ok" data-approve="${item.id}">✅ Freigeben &amp; Ausführen</button>
        <button class="btn danger" data-reject="${item.id}">Verwerfen</button>
      </div>
    </article>`).join("");
  renderHeader();
}

function escapeHtml(s) {
  return String(s ?? "")
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;");
}

async function ensureSeedQueue() {
  let list = await firebaseAdapter.listApprovals();
  if (!list.length && ROLE.mockQueue?.length) {
    list = ROLE.mockQueue.map((m) => ({
      id: uid(),
      status: "pending_approval",
      skillId: m.skillId,
      title: m.title,
      preview: m.preview,
      createdAt: now(),
      updatedAt: now(),
    }));
    writeLs(LS.queue, list);
  }
  state.queue = list;
}

async function runSkill(skillId, context = {}) {
  if (state.busy) return;
  state.busy = true;
  log("system", `Skill ${skillId} mit Modell ${llmRouter.model} gestartet…`);
  try {
    const result = await llmRouter.run({ skillId, context });
    log("assistant", result.preview);
    log("system", `Fertig · Quelle ${result.source} · Engine ${result.engine}`);
    if (result.requiresApproval) {
      const item = {
        id: uid(),
        status: "pending_approval",
        skillId,
        title: result.title,
        preview: result.preview,
        createdAt: now(),
        updatedAt: now(),
        meta: context,
      };
      await firebaseAdapter.upsertApproval(item);
      state.queue = await firebaseAdapter.listApprovals();
      renderQueue();
    }
  } finally {
    state.busy = false;
  }
}

async function runChat(text) {
  log("user", text);
  state.busy = true;
  try {
    const result = await llmRouter.run({ message: text });
    log("assistant", result.preview);
  } finally {
    state.busy = false;
  }
}

function wire() {
  $("#model").addEventListener("change", (e) => {
    llmRouter.setModel(e.target.value);
    log("system", `Modell gewechselt → ${e.target.value}`);
  });
  $("#focus").addEventListener("click", (e) => {
    const btn = e.target.closest("[data-skill]");
    if (!btn) return;
    const card = ROLE.focus[Number(btn.dataset.focus)];
    runSkill(btn.dataset.skill, { ...(card?.ctx || {}) });
  });
  $("#launcher").addEventListener("click", (e) => {
    const btn = e.target.closest("[data-launch]");
    if (!btn) return;
    const id = btn.dataset.launch;
    const defaults = {
      draft_linkedin_post: { topic: "Vitalität 40+" },
      draft_instagram_caption: { topic: "Alltagsenergie", format: "reel" },
      plan_content_week: { week: "current" },
      nurture_lead_reply: { leadName: "Lead", channel: "email", context: "Interesse am 10er" },
      onboard_client: { name: "Neuer Klient", email: "neu@example.com", package: "10er Coaching" },
      process_call_transcript: { transcript: "(Transkript hier einfügen)", clientName: "Session" },
      prioritize_backlog: { items: "UFO Slice\nC-Suite\nSchmiede abhängen" },
      draft_release_notes: { changes: "C-Suite Dashboards" },
      package_price_check: { package: "10er Coaching", proposedPrice: "fehlt" },
      expense_note: { vendor: "Hosting", amount: "12€", category: "tools" },
      escalate_owner_gate: { question: "Eine SOT für Pläne?", evidence: "Zwei Schreibpfade live" },
      plan_server_change: { change: "Workspaces static serve" },
    };
    runSkill(id, defaults[id] || {});
  });
  $("#queue").addEventListener("click", async (e) => {
    const approve = e.target.closest("[data-approve]");
    const reject = e.target.closest("[data-reject]");
    if (approve) {
      const id = approve.dataset.approve;
      const ta = document.querySelector(`textarea[data-edit="${id}"]`);
      const item = state.queue.find((q) => q.id === id);
      if (!item) return;
      item.preview = ta?.value ?? item.preview;
      item.status = "approved";
      item.updatedAt = now();
      await firebaseAdapter.upsertApproval(item);
      await firebaseAdapter.removeApproval(id);
      state.queue = await firebaseAdapter.listApprovals();
      log("system", `Freigegeben & ausgeführt (Stub): ${item.title}`);
      renderQueue();
    }
    if (reject) {
      const id = reject.dataset.reject;
      await firebaseAdapter.removeApproval(id);
      state.queue = await firebaseAdapter.listApprovals();
      log("system", `Verworfen: ${id}`);
      renderQueue();
    }
  });
  const form = $("#composer");
  const input = $("#prompt");
  form.addEventListener("submit", (e) => {
    e.preventDefault();
    const text = input.value.trim();
    if (!text || state.busy) return;
    input.value = "";
    runChat(text);
  });
  input.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey) {
      e.preventDefault();
      form.requestSubmit();
    }
  });
}

async function boot() {
  const conn = await firebaseAdapter.connect();
  state.sync = conn.mode;
  $(".dot").classList.toggle("live", conn.mode !== "mock");
  $(".sync-label").textContent = conn.mode === "mock" ? "Sync: lokal (Mock)" : "Sync: Firebase";
  const brain = await loadWorkspaceBrain();
  await ensureSeedQueue();
  renderHeader();
  renderFocus();
  renderLauncher();
  renderChat();
  renderQueue();
  wire();
  if (!state.chat.length) {
    const brainNote = brain.loaded
      ? `Brain: system-prompt.md + skills.json v${brain.skillsConfig?.version || "?"}`
      : `Brain-Fetch fehlgeschlagen (${brain.error || "offline"}) — eingebettetes ROLE bleibt aktiv`;
    log("system", `${ROLE.id.toUpperCase()}-Cockpit · ${brainNote} · Bridge /api/csuite/run`);
  }
}

boot();

  </script>
