# Eigener Workspace-Root: verhindert, dass pnpm nach oben ins fitness-dev-Root-Workspace greift.
# Zwei Pakete: die App (.) und die Catalog-UI (React 19 / Vite 8 — bewusst getrennte Versionen).
packages:
  - "."
  - "catalog-ui"
allowBuilds:
  '@firebase/util': true
  esbuild: true
  protobufjs: true
overrides:
  '@grpc/grpc-js@<1.13.6': '^1.14.6'
  'minimatch@<11.0.1': '^11.0.1'
  'postcss-selector-parser@<6.1.5': '^6.1.5'
