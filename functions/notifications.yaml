# Texte für Push-Notifications, gelesen von functions/index.js.
# Platzhalter in {geschweiften Klammern} werden zur Laufzeit ersetzt
# (siehe renderTemplate() in index.js). Änderungen hier wirken erst nach
# `firebase deploy --only functions`.

workout:
  title: "Workout Reminder"
  body: "Zeit für dein Training!"
  link: "/?tab=session"

activeWorkout:
  title: "Workout noch offen"
  body: "Vor {minutes} Minuten gestartet. Fertig oder abbrechen?"
  link: "/?tab=session"

restday:
  title: "Alles ok?"
  body: "Letzte Session war vor {days} Tagen"
  link: "/?tab=session"

coverage:
  title: "Coverage-Alert"
  body: "{regions} seit 7 Tagen kaum trainiert"
  link: "/?tab=review"

pplRatio:
  title: "PPL-Ratio kippt"
  body: "{buckets} liegen unter 15 % deiner 7-Tage-Coverage"
  link: "/?tab=review"

habit:
  title: "Habit Reminder"
  body: "Noch offen heute: {names}"
  link: "/?tab=habits"

coachFeedback:
  title: "Coach Feedback"
  link: "/?tab=session"
  # body ist dynamisch (Feedback-Text selbst) — kein Template hier

# Klienten-Workout → Push an den Coach (functions/clientWorkout.js).
# Platzhalter: {name} Vorname des Klienten, {details} "Art · Dauer", {date} Session-Datum, {minutes}.
# Bewusst ohne Notizen/Gewichte/Übungsnamen — die Meldung steht auf dem Sperrbildschirm.
# Der Text "N neue Workouts" (Sammelmeldung) wird im Service Worker zusammengesetzt
# (public/firebase-messaging-sw.js) und steht nicht hier.
clientWorkout:
  title: "{name}: Workout eingegangen"
  titleFinished: "{name}: Workout abgeschlossen"
  body: "{details}"
  bodyDate: "Session vom {date}"      # wenn weder Art noch Dauer bekannt sind
  bodyFallback: "Neue Session"        # wenn auch das Datum fehlt
  nameFallback: "Klient"              # wenn der Klient keinen Anzeigenamen hat
  minutes: "{minutes} min"
  detailSeparator: " · "

# Test-Meldungen aus dem Notification-Panel (functions/pushPrefs.js, sendTestPush)
testReminder:
  title: "Test: Reminder"
  body: "So sehen normale Erinnerungen aus."
  link: "/?tab=session"

testClientWorkout:
  title: "Test: Workout eingegangen"
  body: "Kraft · 45 min (Demo, kein echter Klient)"
